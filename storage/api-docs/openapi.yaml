          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question not found or not owned (via its assessment) by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (`type` not `mcq`, or not exactly 4 choices).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/questions/bulk-store/{assessment_id}:
    post:
      tags: [Admin Assessment Questions]
      summary: Bulk-create questions from a CSV or Excel file
      description: >-
        Reads the first sheet of the uploaded file. Expected header columns
        (case-insensitive): `question_text`, and up to 4 choices in
        `choice_1`..`choice_4` plus `correct_choice` (matched by exact text
        against the non-empty choice values). A row with 1+ non-empty choices is
        created as `mcq` (requires exactly one choice to match `correct_choice`);
        a row with no choices is created as `descriptive`. New questions are
        appended after the assessment's current highest `order`. Failing rows are
        skipped and reported in `errors` rather than aborting the whole import.
        Locked (`403`) once any attempt exists for this assessment. Requires admin authentication.
      operationId: adminBulkStoreQuestions
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Required. CSV or `.xlsx` file with a `question_text` column and optional `choice_1`–`choice_4`/`correct_choice` columns.

      responses:
        '200':
          description: Import processed (individual rows may still have failed — check `errors`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bulk questions upload completed
                  inserted:
                    type: integer
                    description: Number of questions successfully created.
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkImportRowError'
        '400':
          description: File parsed but contained no data rows (only a header, or empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot modify questions after assessment has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed — file missing, or not a `.csv`/`.xlsx` file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/questions/{question_id}/choices:
    get:
      tags: [Admin Assessment Choices]
      summary: List a question's choices
      description: Returns the choices for a question owned (via its assessment) by the authenticated admin, ordered by `order`.
      operationId: adminListChoices
      parameters:
        - name: question_id
          in: path
          required: true
          description: Question ID.
          schema:
            type: integer
      responses:
        '200':
          description: List of choices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssessmentChoice'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question not found or not owned (via its assessment) by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Admin Assessment Choices]
      summary: Add a single choice to a question
      description: >-
        For building up an MCQ question's choices one at a time (as an
        alternative to the all-in-one `with-choices` endpoints). Locked (`403`)
        once any attempt exists for the owning assessment. Requires admin authentication.
      operationId: adminCreateChoice
      parameters:
        - name: question_id
          in: path
          required: true
          description: Question ID, must be owned (via its assessment) by the authenticated admin.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option]
              properties:
                option:
                  type: string
                  description: Required. The choice text.
                is_correct:
                  type: boolean
                  description: Optional, defaults to `false`.
                order:
                  type: integer
                  nullable: true
                  description: Optional. Defaults to `0` at the database level.
      responses:
        '201':
          description: Choice created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentChoice'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot modify choices after assessment has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Question not found or not owned (via its assessment) by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing `option`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/choices/{id}:
    put:
      tags: [Admin Assessment Choices]
      summary: Update a choice
      description: >-
        Partial update — omitted fields keep their current value. Locked
        (`403`) once any attempt exists for the owning assessment. Requires admin authentication.
      operationId: adminUpdateChoice
      parameters:
        - name: id
          in: path
          required: true
          description: Choice ID, must be owned (via its question's assessment) by the authenticated admin.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option:
                  type: string
                  description: Optional.
                is_correct:
                  type: boolean
                  description: Optional.
                order:
                  type: integer
                  nullable: true
                  description: Optional.
      responses:
        '200':
          description: Choice updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentChoice'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot modify choices after assessment has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Choice not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin Assessment Choices]
      summary: Delete a choice
      description: Locked (`403`) once any attempt exists for the owning assessment. Requires admin authentication.
      operationId: adminDeleteChoice
      parameters:
        - name: id
          in: path
          required: true
          description: Choice ID, must be owned (via its question's assessment) by the authenticated admin.
          schema:
            type: integer
      responses:
        '200':
          description: Choice deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Choice deleted
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot delete choices after assessment has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Choice not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/assignments/users-with-assignment-status:
    get:
      tags: [Admin Assessment Assignments]
      summary: List all users with their assignment status for an assessment
      description: >-
        Returns **every** user in the system (not just assigned ones), each
        annotated with whether they're already assigned to this
        assessment/batch and whether assigning them would conflict with another
        non-flexible assessment they're already assigned to at an overlapping
        date/time. Intended to drive an admin UI for picking which users to
        assign next. Requires admin authentication.
      operationId: adminListAssignmentCandidates
      parameters:
        - name: assessment_id
          in: query
          required: true
          description: Required. Must be an assessment owned by the authenticated admin.
          schema:
            type: integer

        - $ref: '#/components/parameters/BatchIdQuery'

      responses:
        '200':
          description: List of users with assignment status.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                      example: 1

                    name:
                      type: string
                      example: "John Doe"

                    assigned:
                      type: boolean
                      description: Whether this user already has an assignment for this assessment/batch.
                      example: true

                    has_time_conflict:
                      type: boolean
                      description: Whether this user has another non-flexible assessment overlapping this batch's date/time. Always `false` for flexible assessments (no time window to conflict on).
                      example: false

                    conflicting_assessment_id:
                      type: integer
                      nullable: true
                      example: null

                    conflicting_assessment_title:
                      type: string
                      nullable: true
                      example: null

        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Assessment not found or not owned by admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Validation failed, or `batch_id` is missing/invalid for a batch-wise assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/assignments:
    post:
      tags: [Admin Assessment Assignments]
      summary: Assign an assessment to one or more users
      description: >-
        Creates (or restores a previously soft-deleted) assignment for each user,
        and sends each of them an `assessment_assigned` notification. Users with
        a scheduling conflict against another non-flexible assessment at the same
        date/time are skipped and reported under `blocked_due_to_conflict` rather
        than failing the whole request. Locked (`403`) once any attempt exists
        for the resolved batch. Requires admin authentication.
      operationId: adminCreateAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id, user_ids]
              properties:
                assessment_id:
                  type: integer
                  description: Required. Must be owned by the authenticated admin.
                user_ids:
                  type: array
                  description: Required. At least 1 item. Each must be an existing user ID.
                  items:
                    type: integer
                batch_id:
                  type: integer
                  nullable: true
                  description: >-
                    Required when the assessment is batch-wise; ignored (the
                    latest batch is used) for non-batch-wise assessments.
      responses:
        '201':
          description: Assignment completed (some users may have been skipped — see `blocked_due_to_conflict`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assignment completed
                  assigned:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentAssignment'
                  blocked_due_to_conflict:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        conflicting_assessment_id:
                          type: integer
                        conflicting_assessment_title:
                          type: string
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot assign users after batch has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed, or `batch_id` is missing/invalid for a batch-wise assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin Assessment Assignments]
      summary: Remove assessment assignments for one or more users
      description: >-
        Deletes the assignment rows for the given users on the resolved batch.
        Locked (`403`) once any attempt exists for that batch. Requires admin authentication.
      operationId: adminDeleteAssignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id, user_ids]
              properties:
                assessment_id:
                  type: integer
                  description: Required. Must be owned by the authenticated admin.
                  example: 0
                user_ids:
                  type: array
                  description: Required. At least 1 item. Each must be an existing user ID.
                  minItems: 1
                  items:
                    type: integer
                batch_id:
                  type: integer
                  nullable: true
                  description: >-
                    Required when the assessment is batch-wise; ignored (the
                    latest batch is used) for non-batch-wise assessments.
      responses:
        '200':
          description: Assignments removed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Users unassigned successfully
                  deleted_count:
                    type: integer
                    description: Number of assignment rows actually removed.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot unassign users after batch has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed, or `batch_id` is missing/invalid for a batch-wise assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/finished:
    get:
      tags: [Admin Assessment Results]
      summary: List finished (batch-wise) assessments awaiting review
      description: >-
        One row per (assessment, batch) pair whose window has closed: for
        flexible assessments this is always true (results are always browsable);
        for non-flexible ones, the batch's publish date is in the past, or today
        with `end_time` already passed. Only active assessments are considered.
        Entry point for browsing per-candidate results.
      operationId: adminListFinishedAssessments
      responses:
        '200':
          description: List of finished assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/{assessment_id}/users:
    get:
      tags: [Admin Assessment Results]
      summary: List assigned users with their attempt status for an assessment
      description: >-
        One row per distinct assigned user (their most recent assignment if
        assigned more than once), flagging whether they've submitted and whether
        their attempt is still awaiting manual grading.
      operationId: adminListResultUsers
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer

        - $ref: '#/components/parameters/BatchIdQuery'

      responses:
        '200':
          description: List of users with attempt status.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                    name:
                      type: string
                    attempted:
                      type: boolean
                      description: Whether this user has submitted an attempt for this assessment/batch.
                    grade_pending:
                      type: boolean
                      description: Whether the submitted attempt still has a `"Pending Evaluation"` score awaiting manual grading.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`batch_id` is missing or invalid for a batch-wise assessment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/{assessment_id}/user/{user_id}:
    get:
      tags: [Admin Assessment Results]
      summary: Get a user's final result for an assessment
      description: >-
        Full breakdown of a submitted, fully-graded attempt: score, per-question
        correctness and the choices offered. Returns `403` while any question is
        still awaiting manual grading — use the grading endpoints first.
      operationId: adminGetUserResult
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer

        - name: user_id
          in: path
          required: true
          description: User ID.
          schema:
            type: integer

        - $ref: '#/components/parameters/BatchIdQuery'

      responses:
        '200':
          description: User result details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment_id:
                    type: integer
                  batch_id:
                    type: integer
                    nullable: true
                  user_id:
                    type: integer
                  score:
                    type: integer
                  total_marks:
                    type: integer
                  percentage:
                    type: integer
                  correct:
                    type: integer
                  wrong:
                    type: integer
                  unanswered:
                    type: integer
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                          description: The assessment's type slug (all questions in one assessment share the same type).
                        question_text:
                          type: string
                        options:
                          type: array
                          description: Present (possibly empty) for every question type; only meaningful for MCQ.
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              option:
                                type: string
                        user_answer:
                          type: string
                          nullable: true
                          description: Raw stored answer value for this question (e.g. choice text is not resolved — this is the raw `answer` JSON's scalar content where applicable).
                        is_correct:
                          type: boolean
                          nullable: true

        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: User has not submitted the assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Assessment results are not available yet (still pending manual evaluation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`batch_id` is missing or invalid for a batch-wise assessment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/{assessment_id}/user/{user_id}/answers:
    get:
      tags: [Admin Assessment Results]
      summary: Get a user's answers for manual grading
      description: >-
        Returns the submitted answers for an attempt that is still
        `"Pending Evaluation"`, for the admin to grade question-by-question via
        the grade endpoint. Returns `400` if the attempt hasn't been submitted
        yet, or has already been fully evaluated.
      operationId: adminGetAnswersForGrading
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer

        - name: user_id
          in: path
          required: true
          description: User ID.
          schema:
            type: integer

        - $ref: '#/components/parameters/BatchIdQuery'

      responses:
        '200':
          description: Questions with the user's answers, ready for grading.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment_id:
                    type: integer
                  batch_id:
                    type: integer
                    nullable: true
                  user_id:
                    type: integer
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        question_id:
                          type: integer
                        type:
                          type: string
                        question_text:
                          type: string
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              option:
                                type: string
                        user_answer:
                          type: string
                          nullable: true
                        is_correct:
                          type: boolean
                          nullable: true
                          description: Null until this specific question is graded.

        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 'User has not submitted the assessment yet, or the attempt has already been fully evaluated.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment or attempt not found (attempt not found includes the case where the user was never assigned or never attempted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`batch_id` is missing or invalid for a batch-wise assessment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/{assessment_id}/user/{user_id}/question/{question_id}/grade:
    post:
      tags: [Admin Assessment Results]
      summary: Grade one manually-graded answer
      description: >-
        Records correct/incorrect for a single question of a submitted,
        not-yet-fully-evaluated attempt. Not available for `mcq` assessments,
        which are always auto-graded on submit. Once every question in the
        attempt has been graded, the final score is computed automatically
        (`correct` count, minus negative marking if `has_negative` is set,
        floored at 0) and the response includes it under `score`; otherwise the
        response reports how many questions have been graded so far. Does not
        verify that `question_id` belongs to this assessment. Requires admin authentication.
      operationId: adminGradeAnswer
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer

        - name: user_id
          in: path
          required: true
          description: User ID.
          schema:
            type: integer

        - name: question_id
          in: path
          required: true
          description: Question ID within the assessment.
          schema:
            type: integer

        - $ref: '#/components/parameters/BatchIdQuery'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_correct
              properties:
                is_correct:
                  type: boolean
                  description: Required. Whether this answer is correct.
                  example: true

      responses:
        '200':
          description: Answer graded. `score` is only present once every question has been graded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Answer graded successfully
                  score:
                    type: string
                    nullable: true
                    description: '`"<value>/<total>"`. Present only in the response that completes grading.'
                  graded:
                    type: integer
                    nullable: true
                    description: Questions graded so far. Present only while grading is incomplete.
                  total:
                    type: integer
                    nullable: true
                    description: Total questions in the assessment. Present only while grading is incomplete.

        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: 'The attempt has not been submitted yet, has already been fully evaluated, or this is an `mcq` assessment (auto-graded — cannot be manually regraded).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment or attempt not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing `is_correct`), or `batch_id` is missing/invalid for a batch-wise assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/results/{assessment_id}/rank-list:
    get:
      tags: [Admin Assessment Results]
      summary: Get the rank list for an assessment
      description: >-
        Ranks every submitted, evaluated attempt for this assessment/batch by
        percentage score, highest first (rank `1` = highest). Attempts that
        are unsubmitted or still pending evaluation are excluded rather than
        ranked at 0%. Uses the same batch resolution as the other results
        endpoints: pass `batch_id` for a batch-wise assessment, omit it
        otherwise. Requires admin authentication.
      operationId: adminGetRankList
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID.
          schema:
            type: integer
        - $ref: '#/components/parameters/BatchIdQuery'
      responses:
        '200':
          description: Rank list computed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment_id:
                    type: integer
                  batch_id:
                    type: integer
                    nullable: true
                  rank_list:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                          example: 1
                        user_id:
                          type: integer
                        name:
                          type: string
                        score:
                          type: number
                        total_marks:
                          type: integer
                        percentage:
                          type: number
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: batch_id is missing/invalid for a batch-wise assessment, or no batch exists for this assessment yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/re-exam:
    post:
      tags: [Admin Re-Exam]
      summary: Schedule a re-exam batch for specific or previously-assigned users
      description: >-
        Creates a brand-new batch (named `re_exam_batch_{assessment_id}_{timestamp}`)
        and assigns users to it, notifying each with a `re_exam_assigned`
        notification. Not available for flexible assessments (`422`). Two user
        selection modes: `use_previous_users = true` reuses everyone assigned to
        `source_batch_id` (or the assessment's implicit batch, for non-batch-wise
        assessments); `use_previous_users = false` requires an explicit
        `user_ids` list. The source batch's `capacity` is copied onto the new
        batch. Fails with `422` if the source batch (when applicable) hasn't
        finished yet, or if no users end up being assigned. Requires admin authentication.
      operationId: adminCreateReExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assessment_id
                - use_previous_users
                - publish_date
                - start_time
                - end_time
              properties:
                assessment_id:
                  type: integer
                  description: Required. Must be owned by the authenticated admin, and not flexible.
                use_previous_users:
                  type: boolean
                  description: >-
                    Required. `true` to copy the assignment list from
                    `source_batch_id`/the implicit batch; `false` to assign
                    exactly `user_ids`.
                source_batch_id:
                  type: integer
                  nullable: true
                  description: >-
                    Required (via `use_previous_users = true`) for batch-wise
                    assessments to identify which batch's roster to copy.
                    Optional and only used to copy `capacity` when
                    `use_previous_users = false`.
                user_ids:
                  type: array
                  nullable: true
                  description: Required (and must be non-empty) when `use_previous_users` is `false`; ignored otherwise.
                  items:
                    type: integer
                publish_date:
                  type: string
                  format: date
                  description: Required. Date the re-exam batch opens.
                start_time:
                  type: string
                  description: >-
                    Required. Free-form (not validated against `H:i:s` like the
                    plain batch endpoint) — pass a time string, e.g. `10:00:00`.
                  example: "10:00:00"
                end_time:
                  type: string
                  description: Required. Must be chronologically after `start_time`.
                  example: "12:00:00"
      responses:
        '201':
          description: Re-exam created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Re-exam created successfully
                  batch:
                    $ref: '#/components/schemas/Batch'
                  assigned_users_count:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, the assessment is flexible (unsupported), a
            required batch-wise `source_batch_id`/`user_ids` was missing, the
            source batch hasn't finished yet, or no users ended up matching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/re-exam/filtered:
    post:
      tags: [Admin Re-Exam]
      summary: Schedule a re-exam for users filtered by outcome (failed / absent / both)
      description: >-
        Like the plain re-exam endpoint, but automatically selects users from
        `source_batch_id`'s roster based on their outcome instead of an explicit
        list: `absent` (never attempted or never submitted), `failed`
        (submitted, evaluated, below `passing_percentage`), or `both`. Not
        available for flexible assessments (`422`). Fails with `422` if the
        source batch hasn't finished yet, or if no users match the filter.
        Requires admin authentication.
      operationId: adminCreateFilteredReExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assessment_id
                - filter
                - publish_date
                - start_time
                - end_time
              properties:
                assessment_id:
                  type: integer
                  description: Required. Must be owned by the authenticated admin, and not flexible.

                filter:
                  type: string
                  enum: [failed, absent, both]
                  description: Required. Which outcome to select users by.

                passing_percentage:
                  type: number
                  nullable: true
                  description: Required when `filter` is `failed` or `both` (otherwise ignored). 0–100.

                source_batch_id:
                  type: integer
                  nullable: true
                  description: Required if the assessment is batch-wise; for non-batch-wise assessments the implicit batch is used automatically.

                publish_date:
                  type: string
                  format: date
                  description: Required.

                start_time:
                  type: string
                  description: Required. Free-form time string.
                  example: "10:00:00"

                end_time:
                  type: string
                  description: Required. Must be chronologically after `start_time`.
                  example: "12:00:00"

      responses:
        '201':
          description: Filtered re-exam created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Filtered re-exam created successfully
                  batch:
                    $ref: '#/components/schemas/Batch'
                  assigned_users_count:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, missing `passing_percentage` for `failed`/`both`,
            missing `source_batch_id` for a batch-wise assessment, the
            assessment is flexible, the source batch hasn't finished yet, or no
            users matched the filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Full admin dashboard
      description: >-
        Single aggregate endpoint for the admin dashboard. Returns assessment,
        batch, candidate and attempt counters together with the score
        distribution, top performers, next scheduled batches, latest attempts
        and the manual-grading queue. Everything is scoped to assessments owned
        by the authenticated admin. Requires admin authentication.
      operationId: adminDashboard
      parameters:
        - name: limit
          in: query
          required: false
          description: Size of each embedded list (`top_performers`, `upcoming_batches`, `recent_attempts`, `pending_evaluations`). Values below 1 fall back to the default; values above 50 are clamped to 50.
          schema:
            type: integer
            default: 5
            maximum: 50

      responses:
        '200':
          description: Dashboard payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments:
                    type: object
                    properties:
                      total:
                        type: integer
                      active:
                        type: integer
                      library:
                        type: integer
                      batch_wise:
                        type: integer
                      flexible:
                        type: integer
                      by_type:
                        type: object
                        description: Assessment count keyed by assessment type slug.
                        additionalProperties:
                          type: integer
                        example:
                          mcq: 8
                          descriptive: 2

                  batches:
                    type: object
                    properties:
                      total:
                        type: integer
                      upcoming:
                        type: integer
                      running:
                        type: integer
                      finished:
                        type: integer

                  questions:
                    type: integer
                    description: Total questions across the admin's assessments.

                  candidates:
                    type: integer
                    description: Distinct users assigned to the admin's assessments.

                  assignments:
                    type: integer
                    description: Total assignment rows across the admin's assessments.

                  attempts:
                    type: object
                    properties:
                      total:
                        type: integer
                      in_progress:
                        type: integer
                        description: Started but not submitted.
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                        description: Submitted, awaiting manual grading.
                      evaluated:
                        type: integer
                      completion_rate:
                        type: number
                        description: Submitted attempts as a percentage of assignments.

                  average_percentage:
                    type: number
                    description: Mean percentage over evaluated attempts, 0 when none.

                  score_distribution:
                    $ref: '#/components/schemas/ReportScoreDistribution'

                  top_performers:
                    type: array
                    description: Highest average scorers, best first.
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        attempts:
                          type: integer
                          description: Number of evaluated attempts by this user.
                        average_percentage:
                          type: number

                  upcoming_batches:
                    type: array
                    description: Next scheduled batches, soonest first.
                    items:
                      type: object
                      properties:
                        batch_id:
                          type: integer
                        batch_name:
                          type: string
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                        publish_date:
                          type: string
                          format: date
                          nullable: true
                        start_time:
                          type: string
                          nullable: true
                          example: '09:00:00'
                        end_time:
                          type: string
                          nullable: true
                          example: '10:30:00'
                        capacity:
                          type: integer
                          nullable: true

                  recent_attempts:
                    type: array
                    description: Latest attempts across every owned assessment, newest first.
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        started_at:
                          type: string
                          nullable: true
                          example: '17:22:47'
                        submitted_at:
                          type: string
                          nullable: true
                          example: '18:36:09'
                        status:
                          type: string
                          enum: [in_progress, pending_evaluation, evaluated]
                        score:
                          type: number
                          nullable: true
                          description: Null unless the attempt is submitted and evaluated.
                        total_marks:
                          type: integer
                          nullable: true
                        percentage:
                          type: number
                          nullable: true

                  pending_evaluations:
                    type: array
                    description: Submitted attempts still waiting on manual grading, newest first.
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

