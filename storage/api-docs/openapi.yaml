openapi: 3.0.0

info:
  title: EMS Auth & Assessment API
  description: >-
    Admin & User APIs for the exam/assessment management system (Laravel 12 + Passport).
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local — mobile apps (Bearer token)
  - url: http://127.0.0.1:8000/web/v1
    description: Local — web (httpOnly cookie + CSRF)

  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/web/v1
    description: Production — web (httpOnly cookie + CSRF)
  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/api/v1
    description: Production — mobile apps (Bearer token)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Laravel Passport access token. Send as `Authorization: Bearer <token>`.
        Required on every endpoint except register/login/logout-adjacent public
        auth routes (marked `security: []` below). Admin tokens only authorize
        `/admin/*` routes (guard `admins`); user tokens only authorize `/user/*`
        routes (guard `users`). On the `web/v1/*` mount the same authorization can
        instead be supplied via the `admin_access_token` / `user_access_token`
        httpOnly cookie set at login — the cookie is transparently rewritten into
        this header server-side, so the documented Bearer requirement applies
        either way.

  parameters:
    ReportAssessmentId:
      name: assessment_id
      in: query
      required: false
      description: >-
        Restrict the report to a single assessment. Must be the ID of an
        assessment (admin reports: owned by the authenticated admin). Returns
        `422` if the ID does not exist.
      schema:
        type: integer

    ReportBatchId:
      name: batch_id
      in: query
      required: false
      description: >-
        Restrict the report to a single batch. Returns `422` if the ID does not
        exist. Not cross-checked against `assessment_id` — combining filters for
        unrelated assessment/batch pairs simply yields an empty result set.
      schema:
        type: integer

    ReportUserId:
      name: user_id
      in: query
      required: false
      description: >-
        Restrict the report to a single candidate. Admin reports only — there is
        no equivalent filter on the user-facing reports, since those are already
        scoped to the authenticated user. Returns `422` if the ID does not exist.
      schema:
        type: integer

    ReportAssessmentType:
      name: assessment_type
      in: query
      required: false
      description: >-
        Restrict to assessments whose type slug matches exactly (e.g. `mcq`,
        `descriptive` — any slug present in `assessment_types.slug`). Not
        validated against the table, so an unknown slug simply matches nothing
        rather than returning an error.
      schema:
        type: string
        example: mcq

    ReportStatus:
      name: status
      in: query
      required: false
      description: >-
        Restrict to attempts in a single lifecycle state: `in_progress` (started,
        not submitted), `pending_evaluation` (submitted, awaiting manual grading
        for descriptive questions), or `evaluated` (submitted and
        a final score is available).
      schema:
        type: string
        enum: [in_progress, pending_evaluation, evaluated]

    ReportPassingPercentage:
      name: passing_percentage
      in: query
      required: false
      description: >-
        Percentage threshold used to compute pass/fail counts and rates in this
        report. Purely a report-time comparison — it is not stored anywhere and
        has no effect on grading.
      schema:
        type: number
        default: 40
        minimum: 0
        maximum: 100

    ReportFrom:
      name: from
      in: query
      required: false
      description: >-
        Start of the date range (inclusive). Applied to the attempt's `created_at`,
        because `started_at` and `submitted_at` are TIME-only columns with no date
        component and can't be range-filtered directly.
      schema:
        type: string
        format: date
        example: '2026-01-01'

    ReportTo:
      name: to
      in: query
      required: false
      description: >-
        End of the date range (inclusive), compared against the attempt's
        `created_at` for the same reason as `from`. Must be on or after `from`
        when both are supplied, or the request returns `422`.
      schema:
        type: string
        format: date
        example: '2026-01-31'

    ReportPage:
      name: page
      in: query
      required: false
      description: 1-based page number for the paginated `data` array.
      schema:
        type: integer
        default: 1
        minimum: 1

    ReportPageSize:
      name: page_size
      in: query
      required: false
      description: Rows per page.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 200

    BatchIdQuery:
      name: batch_id
      in: query
      required: false
      description: >-
        Batch to scope the request to. **Required** when the assessment is
        batch-wise (`is_batch_wise = true`) — there is no default to fall back to,
        and the request returns `422` if omitted or if the ID does not belong to
        this assessment. For non-batch-wise assessments this is optional and
        defaults to the assessment's most recently created batch (the one
        auto-created alongside it, or the latest re-exam batch).
      schema:
        type: integer

  schemas:
    Error:
      type: object
      description: >-
        Standard error payload returned by every non-2xx response in this API.
        Validation failures (`422` from `$request->validate()`) additionally
        include an `errors` object.
      properties:
        message:
          type: string
          description: Human-readable description of what went wrong.
          example: Unauthenticated.
        errors:
          type: object
          description: >-
            Present only on Laravel validation failures. Keyed by field name,
            each value is an array of one or more human-readable messages for
            that field.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["The email field is required."]

    Admin:
      type: object
      description: >-
        An admin account (exam creator/grader). Authenticates via the `admins`
        Passport guard. Serialized directly from the Eloquent model, so
        `password` and timestamp columns are never included.
      properties:
        id:
          type: integer
          description: Primary key.
        name:
          type: string
        email:
          type: string
          format: email
          description: Unique across all admins.

    User:
      type: object
      description: >-
        A user account (exam taker). Authenticates via the `users` Passport
        guard. Serialized directly from the Eloquent model, so `password` and
        `email_verified_at` are never included.
      properties:
        id:
          type: integer
          description: Primary key.
        name:
          type: string
        email:
          type: string
          format: email
          description: Unique across all users. Must be verified via OTP before login succeeds.
        avatar:
          type: string
          nullable: true
          description: Free-form avatar reference (URL or file path). Not set by any documented endpoint today.

    AdminAuthResponse:
      type: object
      description: Returned by admin register/login, alongside the same token set as an httpOnly cookie.
      properties:
        token:
          type: string
          description: Passport access token. Also usable as a Bearer token on the `api/v1/*` mount.
        admin:
          $ref: '#/components/schemas/Admin'

    UserAuthResponse:
      type: object
      description: Returned by user login, alongside the same token set as an httpOnly cookie.
      properties:
        token:
          type: string
          description: Passport access token. Also usable as a Bearer token on the `api/v1/*` mount.
        user:
          $ref: '#/components/schemas/User'

    AssessmentType:
      type: object
      description: >-
        A category of assessment. Grading behavior in `AssessmentAttemptController`
        branches on `slug`: `mcq` is auto-graded, `descriptive` is queued for
        manual grading. Managed outside the API surface (seeder only — there is
        no create/update/delete endpoint for this resource).
      properties:
        id:
          type: integer
        name:
          type: string
          example: MCQ
        slug:
          type: string
          description: Unique machine-readable identifier, matched exactly at grading/answer time.
          example: mcq
        description:
          type: string
          nullable: true
        is_active:
          type: boolean

    Assessment:
      type: object
      description: >-
        An exam definition: questions, grading rules and scheduling mode. Owned by
        exactly one admin. Once at least one attempt exists against it, its
        structural fields (questions, choices, `is_batch_wise`, `is_flexible`) and
        the assessment itself become locked against modification/deletion — see
        each endpoint's `403` response.
      properties:
        id:
          type: integer
        admin_id:
          type: integer
          description: Owning admin — every admin action on this assessment is scoped to this value.
        assessment_type_id:
          type: integer
          description: Foreign key to `assessment_types`; determines grading behavior via its `slug`.
        title:
          type: string
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          description: Inactive assessments are excluded from the upcoming/running/finished listings on both sides.
        difficulty_level:
          type: string
          description: Free-text label (e.g. `easy`, `medium`, `hard`). Not constrained to a fixed set by validation.
          example: medium
        shuffle:
          type: boolean
          description: When true, each attempt gets its own randomized question order instead of the authored `order`.
        is_library:
          type: boolean
          description: Marks the assessment as a reusable template, surfaced via the library listing.
        has_negative:
          type: boolean
          description: Enables negative marking for MCQ auto-grading.
        negative_marks:
          type: number
          nullable: true
          description: Marks deducted per wrong MCQ answer when `has_negative` is true.
        is_batch_wise:
          type: boolean
          description: >-
            Scheduling mode. When true, the assessment can have multiple batches and
            every request that resolves a batch (start, assignments, results, ...)
            requires an explicit `batch_id`. When false, exactly one batch is
            managed implicitly (auto-created on assessment creation) and `batch_id`
            is resolved automatically. Immutable after creation.
        is_flexible:
          type: boolean
          description: >-
            When true, the assessment has no fixed publish/start/end time — it can
            be attempted any time up until its batch's `expiry_date` (if set), and
            `duration_minutes` on the batch bounds how long a single attempt may
            run. Mutually exclusive with `is_batch_wise`. Immutable after creation.
            Assessments with this flag do not support re-exams.

    AssessmentBatchScheduleFull:
      type: object
      description: >-
        Schedule fields copied from the batch this (assessment, batch) row is
        attached to. `publish_date`/`start_time`/`end_time` apply to non-flexible
        scheduling; `expiry_date`/`duration_minutes` apply to flexible scheduling.
        Both sets are present but only one set is meaningful, depending on the
        assessment's `is_flexible` flag.
      properties:
        batch_id:
          type: integer
          nullable: true
        publish_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          nullable: true
          example: '10:00:00'
        end_time:
          type: string
          nullable: true
          example: '11:00:00'
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Last day this flexible assessment can be attempted. Null means no expiry.
        duration_minutes:
          type: integer
          nullable: true
          description: Time limit for a single attempt of this flexible assessment. Null means unlimited.

    AssessmentBatchScheduleBasic:
      type: object
      description: >-
        Reduced schedule fields returned only by the admin "upcoming assessments"
        listing, which never includes flexible assessments and therefore omits
        `expiry_date`/`duration_minutes`.
      properties:
        batch_id:
          type: integer
          nullable: true
        publish_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          nullable: true
        end_time:
          type: string
          nullable: true

    AdminAssessmentListItem:
      description: >-
        One (assessment, batch) pair. Batch-wise assessments appear once per
        batch, so the same assessment can appear multiple times in a listing.
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - $ref: '#/components/schemas/AssessmentBatchScheduleFull'

    AdminAssessmentUpcomingItem:
      description: One (assessment, batch) pair, for the admin "upcoming" listing only (flexible assessments never appear here).
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - $ref: '#/components/schemas/AssessmentBatchScheduleBasic'

    UserAssessmentListItem:
      description: >-
        An assessment assigned to the requesting user, together with the batch
        it was assigned in. Reused, with identical shape, by every user
        assessment-listing endpoint and by "get assigned assessment".
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - $ref: '#/components/schemas/AssessmentBatchScheduleFull'

    Batch:
      type: object
      description: >-
        A scheduled instance of an assessment for a group of users. Non-batch-wise
        assessments get exactly one batch, auto-created with the reserved name
        `individual_batch_{assessment_id}`; batch-wise assessments can have many.
        Once any attempt exists against a batch, it is locked against
        modification/deletion and against adding/removing assigned users.
      properties:
        id:
          type: integer
        name:
          type: string
          description: Free text, except for the reserved auto-generated names used for individual and re-exam batches.
        assessment_id:
          type: integer
        publish_date:
          type: string
          format: date
          nullable: true
          description: Date the batch is available on, for non-flexible scheduling.
        start_time:
          type: string
          nullable: true
          example: '10:00:00'
          description: Time-of-day the window opens, for non-flexible scheduling. Format `H:i:s`.
        end_time:
          type: string
          nullable: true
          example: '11:00:00'
          description: Time-of-day the window closes, for non-flexible scheduling. Format `H:i:s`. Must be after `start_time`.
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Last day this batch can be attempted, for flexible scheduling. Null means no expiry.
        duration_minutes:
          type: integer
          nullable: true
          description: Per-attempt time limit, for flexible scheduling. Null means unlimited.
        capacity:
          type: integer
          nullable: true
          description: Maximum number of distinct users that may be assigned to this batch. Null means unlimited.

    AssessmentQuestion:
      type: object
      description: A single question belonging to an assessment.
      properties:
        id:
          type: integer
        assessment_id:
          type: integer
        type:
          type: string
          enum: [mcq, descriptive]
          description: >-
            The only two supported question/assessment types. Both are creatable
            through the plain question endpoints.
        question_text:
          type: string
        config:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Free-form structured configuration, stored as JSON. Not used by any
            currently creatable question type.
        order:
          type: integer
          nullable: true
          description: Display/answer order within the assessment. Defaults to `0` at the database level when omitted.

    AssessmentQuestionWithChoices:
      description: A question together with its answer choices.
      allOf:
        - $ref: '#/components/schemas/AssessmentQuestion'
        - type: object
          properties:
            choices:
              type: array
              items:
                $ref: '#/components/schemas/AssessmentChoice'

    AssessmentChoice:
      type: object
      description: >-
        One answer option for an MCQ question. Admin-facing only — includes
        `is_correct`, which is deliberately stripped out of the choices shown to
        users while attempting an assessment.
      properties:
        id:
          type: integer
        question_id:
          type: integer
        option:
          type: string
          description: The choice text shown to the candidate.
        is_correct:
          type: boolean
          description: Marks the correct answer for MCQ auto-grading. Defaults to `false` when omitted.
        order:
          type: integer
          nullable: true
          description: Display order among the question's choices. Defaults to `0` at the database level when omitted.

    AssessmentChoicePublic:
      type: object
      description: >-
        A choice as shown to the candidate while attempting an assessment.
        Deliberately omits `is_correct` so the answer key isn't exposed before
        grading.
      properties:
        id:
          type: integer
        question_id:
          type: integer
        option:
          type: string
        order:
          type: integer
          nullable: true

    AssessmentAssignment:
      type: object
      description: >-
        Links one user to one assessment within one batch — this is what makes an
        assessment "assigned" to a user and controls who may start an attempt.
        Re-exams work by creating a new assignment (and new batch) rather than
        mutating the original.
      properties:
        id:
          type: integer
        assessment_id:
          type: integer
        user_id:
          type: integer
        batch_id:
          type: integer
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true

    AssessmentAttempt:
      type: object
      description: >-
        One user's attempt at an assessment within a specific batch. Created when
        the user starts the assessment; `submitted_at` and `score` are filled in
        on submit. A user gets at most one attempt per (assessment, batch) pair —
        re-exams use a new batch instead of a second attempt in the same batch.
      properties:
        id:
          type: integer
        assessment_id:
          type: integer
        user_id:
          type: integer
        batch_id:
          type: integer
          nullable: true
        started_at:
          type: string
          nullable: true
          example: '10:03:12'
          description: Time-of-day the attempt was started (TIME column, no date part).
        submitted_at:
          type: string
          nullable: true
          example: '10:41:07'
          description: Time-of-day the attempt was submitted. Null while still in progress.
        score:
          type: string
          nullable: true
          description: >-
            Either `"<value>/<total>"` once graded, or the literal string
            `"Pending Evaluation"` while awaiting manual grading. Null before submission.
        question_order:
          type: array
          nullable: true
          items:
            type: integer
          description: >-
            Question IDs in the order presented to this user (shuffled per-attempt
            when the assessment has `shuffle = true`). Generated the first time
            questions are fetched for this attempt.

    AssessmentAnswer:
      type: object
      description: >-
        One user's answer to one question within an attempt. At most one answer
        per (attempt, question) pair — resubmitting the same question overwrites it.
      properties:
        id:
          type: integer
        attempt_id:
          type: integer
        question_id:
          type: integer
        answer:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Shape depends on the assessment type: `{"choice_id": <int>}` for mcq,
            `{"text": "<string>"}` for descriptive.
        is_correct:
          type: boolean
          nullable: true
          description: >-
            Set automatically for mcq at submit time. For manually-graded types,
            null until an admin grades it via the grading endpoint.

    Notification:
      type: object
      description: >-
        An in-app notification for a user or an admin (mutually exclusive —
        exactly one of `user_id`/`admin_id` is set). Created by the assignment and
        re-exam flows; there is no endpoint to create one directly.
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        admin_id:
          type: integer
          nullable: true
        type:
          type: string
          description: Machine-readable event key, e.g. `assessment_assigned`, `re_exam_assigned`.
        title:
          type: string
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: 'Extra context for the event, e.g. `{"assessment_id": 1, "batch_id": 2}`.'
        is_read:
          type: boolean

    BulkImportRowError:
      type: object
      description: One failed row from a bulk CSV/XLSX import.
      properties:
        row:
          type: integer
          description: 1-based spreadsheet row number, including the header row (first data row is `2`).
          example: 2
        error:
          type: string
          example: Invalid email

    ReportFilters:
      type: object
      description: The filters that were actually supplied on the request, echoed back for reference. Empty object when none were supplied.
      additionalProperties: true

    ReportPerformance:
      type: object
      description: Score aggregates over the matching evaluated attempts (attempts with a numeric score, i.e. not in-progress or pending manual grading).
      properties:
        evaluated:
          type: integer
          description: Number of attempts included in this aggregate.
        average_percentage:
          type: number
          description: Mean score percentage across evaluated attempts. `0` when there are none.
        highest_percentage:
          type: number
        lowest_percentage:
          type: number
        passed:
          type: integer
          description: Count with percentage >= the report's `passing_percentage`.
        failed:
          type: integer
        pass_rate:
          type: number
          description: '`passed / evaluated` as a percentage. `0` when there are no evaluated attempts.'

    ReportScoreDistribution:
      type: object
      description: Evaluated attempt counts bucketed by percentage band.
      properties:
        '0-39':
          type: integer
        '40-59':
          type: integer
        '60-79':
          type: integer
        '80-100':
          type: integer

    AdminReportAssessmentRow:
      description: Aggregate stats for one assessment, matching the current filters.
      allOf:
        - type: object
          properties:
            assessment_id:
              type: integer
            title:
              type: string
            type:
              type: string
              nullable: true
              description: Assessment type slug.
            difficulty_level:
              type: string
              nullable: true
            is_active:
              type: boolean
            is_batch_wise:
              type: boolean
            is_flexible:
              type: boolean
            questions:
              type: integer
            batches:
              type: integer
            assigned:
              type: integer
              description: Distinct assignment rows for this assessment matching the filters.
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportBatchRow:
      description: Aggregate stats for one batch, matching the current filters.
      allOf:
        - type: object
          properties:
            batch_id:
              type: integer
            batch_name:
              type: string
            assessment_id:
              type: integer
            assessment_title:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
              enum: [upcoming, running, finished, unscheduled]
              description: Computed schedule state at the time of the request.
            publish_date:
              type: string
              format: date
              nullable: true
            start_time:
              type: string
              nullable: true
            end_time:
              type: string
              nullable: true
            expiry_date:
              type: string
              format: date
              nullable: true
            duration_minutes:
              type: integer
              nullable: true
            capacity:
              type: integer
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            submitted:
              type: integer
            participation_rate:
              type: number
              description: '`attempts / assigned` as a percentage. `0` when nobody is assigned.'
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportUserRow:
      description: Aggregate stats for one candidate, matching the current filters.
      allOf:
        - type: object
          properties:
            user_id:
              type: integer
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportQuestionRow:
      type: object
      description: Accuracy stats for one question across every matching attempt.
      properties:
        question_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        question_text:
          type: string
        type:
          type: string
          nullable: true
        order:
          type: integer
          nullable: true
        answered:
          type: integer
        correct:
          type: integer
        wrong:
          type: integer
        ungraded:
          type: integer
          description: Answers still awaiting manual grading.
        accuracy:
          type: number
          nullable: true
          description: '`correct / (correct + wrong)` as a percentage. Null when nothing has been graded yet.'
        difficulty:
          type: string
          enum: [easy, medium, hard, not_attempted]
          description: Derived from `accuracy` — `easy` >= 80, `medium` >= 50, else `hard`; `not_attempted` when `accuracy` is null.

    AdminReportAttemptRow:
      type: object
      description: One row per attempt matching the filters, for the detailed attempt log.
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        batch_name:
          type: string
          nullable: true
        user_id:
          type: integer
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
          description: Date the attempt row was created (used because `started_at`/`submitted_at` are time-only).
        started_at:
          type: string
          nullable: true
          example: '17:22:47'
        submitted_at:
          type: string
          nullable: true
          example: '18:36:09'
        status:
          type: string
          enum: [in_progress, pending_evaluation, evaluated]
        score:
          type: number
          nullable: true
        total_marks:
          type: integer
          nullable: true
        percentage:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true
          description: Null until the attempt is evaluated.

    UserReportAssessmentRow:
      description: Aggregate stats for one assessment the user has attempted, matching the current filters.
      allOf:
        - type: object
          properties:
            assessment_id:
              type: integer
            assessment_title:
              type: string
              nullable: true
            type:
              type: string
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    UserReportAttemptRow:
      type: object
      description: One row per attempt of the user's own, matching the filters.
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        batch_name:
          type: string
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
        started_at:
          type: string
          nullable: true
        submitted_at:
          type: string
          nullable: true
        status:
          type: string
          enum: [in_progress, pending_evaluation, evaluated]
        score:
          type: number
          nullable: true
        total_marks:
          type: integer
          nullable: true
        percentage:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true

    UserReportQuestionRow:
      type: object
      description: One row per answer the user has given, across their submitted attempts.
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
          nullable: true
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        question_id:
          type: integer
        question_text:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        order:
          type: integer
          nullable: true
        answer:
          nullable: true
          description: The stored answer payload — shape depends on the question's assessment type, see `AssessmentAnswer.answer`.
        is_correct:
          type: boolean
          nullable: true
          description: Null while the answer is not yet graded.
        graded:
          type: boolean

    UserReportProgressRow:
      type: object
      description: One evaluated attempt in chronological order, with a running average.
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
        submitted_at:
          type: string
          nullable: true
        score:
          type: number
        total_marks:
          type: integer
        percentage:
          type: number
        passed:
          type: boolean
        running_average:
          type: number
          description: Cumulative average percentage up to and including this attempt.

    UserDashboardAssessment:
      type: object
      description: An assessment row on the user dashboard, with its batch schedule.
      properties:
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        publish_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          nullable: true
          example: '09:00:00'
        end_time:
          type: string
          nullable: true
          example: '10:30:00'
        expiry_date:
          type: string
          format: date
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        is_flexible:
          type: boolean

security:
  - BearerAuth: []

paths:
  # -------------------------------------------------------- Admin --------------------------------------------------------
  /admin/register:
    post:
      tags: [Admin Auth]
      summary: Register a new admin account
      description: >-
        Creates an admin account. No email verification step exists for admins
        (unlike users) — the account can log in immediately. Requires an
        already-authenticated admin — an anonymous caller cannot create an
        admin account (this previously was a public, unauthenticated endpoint,
        which allowed anyone to self-provision full admin access; that was a
        privilege-escalation vulnerability and has been closed).
      operationId: adminRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  description: Required. Max 255 characters.
                email:
                  type: string
                  format: email
                  description: Required. Must be a valid email and unique across all admins.
                password:
                  type: string
                  format: password
                  description: Required. Minimum 8 characters. Stored hashed.
      responses:
        '201':
          description: Admin created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: Unauthenticated — a valid admin bearer token is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing field, invalid email, or email already registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/login:
    post:
      tags: [Admin Auth]
      summary: Log in as an admin
      description: >-
        Verifies email/password and issues a Passport token, which is returned in
        the response body and also set as the httpOnly `admin_access_token`
        cookie (30 day expiry). Public endpoint, no authentication required.
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  description: Minimum 8 characters (validation only — any length is checked against the stored hash).
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthResponse'
        '401':
          description: Email not found, or password does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing or malformed field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Get the authenticated admin's profile
      description: Returns the admin record for the token/cookie used on the request. Requires admin authentication.
      operationId: adminMe
      responses:
        '200':
          description: Admin profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          description: Unauthenticated — missing, invalid or expired admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/logout:
    post:
      tags: [Admin Auth]
      summary: Log out the authenticated admin
      description: >-
        Revokes the Passport token used on the request and clears the
        `admin_access_token` cookie. Requires admin authentication.
      operationId: adminLogout
      responses:
        '200':
          description: Logged out successfully.
        '401':
          description: Unauthenticated — missing, invalid or expired admin token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users:
    get:
      tags: [Admin Users]
      summary: List all users
      description: >-
        Returns every user in the system (not scoped to any admin — there is no
        per-admin ownership concept for candidates). Requires admin authentication.
      operationId: adminListUsers
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Admin Users]
      summary: Create a user on a candidate's behalf
      description: >-
        Admin-created shortcut for onboarding a single candidate. Unlike
        self-registration (`/user/register`), the email is marked verified
        immediately (`email_verified_at` set to now) — no OTP step is required
        before the user can log in. Requires admin authentication.
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  description: Required. Max 255 characters.
                email:
                  type: string
                  format: email
                  description: Required. Must be a valid email and unique across all users.
                password:
                  type: string
                  format: password
                  description: Required. Minimum 8 characters (matches self-registration). Stored hashed.
      responses:
        '201':
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing field, invalid email, or email already registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/users/bulk-assign:
    post:
      tags: [Admin Users]
      summary: Bulk-create users from a CSV or Excel file
      description: >-
        Reads the first sheet of the uploaded file; the first row must be a
        header naming at least `name`, `email` and (optionally) `password`
        columns (case-insensitive). Each data row is processed independently and
        does not stop the batch on failure: rows with a missing/invalid email or
        an email that already exists are skipped and reported in `errors`. A
        row with no `password` column gets a unique randomly-generated
        temporary password (not a shared default) — every generated password
        is returned in `generated_passwords` so the admin can distribute it;
        it cannot be recovered afterward since only its hash is stored. Every
        created user has `email_verified_at` set immediately, same as the
        single-create endpoint. Requires admin authentication.
      operationId: adminBulkAssignUsers
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Required. CSV or `.xlsx` file with a header row containing at least `name` and `email` columns.

      responses:
        '200':
          description: Import processed (individual rows may still have failed — check `errors`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bulk upload completed
                  inserted:
                    type: integer
                    description: Number of users successfully created.
                    example: 25
                  generated_passwords:
                    type: array
                    description: One entry per created user whose row had no password column. Shown only once — not recoverable afterward.
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          format: email
                        temporary_password:
                          type: string
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkImportRowError'

        '400':
          description: File parsed but contained no data rows (only a header, or empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Validation failed — file missing, or not a `.csv`/`.xlsx` file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/batches:
    get:
      tags: [Admin Batches]
      summary: List all batches for the admin's assessments
      description: Returns every batch belonging to an assessment owned by the authenticated admin, across all assessments. Requires admin authentication.
      operationId: adminListBatches
      responses:
        '200':
          description: List of batches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Admin Batches]
      summary: Create a batch for an assessment
      description: >-
        Creates an additional scheduled instance of an assessment owned by the
        authenticated admin. Rejected with `422` if its publish date and time
        window overlap an existing batch of the same assessment. For a
        **non-batch-wise** assessment, this also fails with `422` ("Default batch
        exists") whenever the assessment's auto-created default batch already
        exists — which it always does once the assessment itself has been
        created — so in practice this endpoint is only useful for batch-wise
        assessments; non-batch-wise assessments manage their single implicit
        batch via the assessment's own create/update endpoints. Requires admin
        authentication.
      operationId: adminCreateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, publish_date, start_time, end_time, assessment_id, capacity]
              properties:
                name:
                  type: string
                  description: Required. Max 255 characters.
                publish_date:
                  type: string
                  format: date
                  description: Required. Date the batch opens.
                start_time:
                  type: string
                  description: Required. Format `H:i:s`.
                  example: '10:00:00'
                end_time:
                  type: string
                  description: Required. Format `H:i:s`.
                  example: '11:00:00'
                assessment_id:
                  type: integer
                  description: Required. Must be an assessment owned by the authenticated admin.
                capacity:
                  type: integer
                  description: Required. Minimum 1 — maximum number of distinct users assignable to this batch.
      responses:
        '201':
          description: Batch created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The assessment does not exist or is not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, or a business rule was violated: overlapping batch
            time window for the same assessment/date ("Batch time conflict"), or
            the assessment is non-batch-wise and already has its default batch
            ("Default batch exists").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/batches/{id}:
    get:
      tags: [Admin Batches]
      summary: Get a single batch
      description: Retrieve one batch, scoped to an assessment owned by the authenticated admin.
      operationId: adminGetBatch
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID.
          schema:
            type: integer
      responses:
        '200':
          description: Batch details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or does not belong to an assessment owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Admin Batches]
      summary: Update a batch
      description: >-
        Partial update — omitted fields keep their current value. Locked (`403`)
        once any attempt exists for this batch. The same time-overlap and
        default-batch-name checks as create apply, evaluated against the
        merged (existing + submitted) values. Requires admin authentication.
      operationId: adminUpdateBatch
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Optional. Max 255 characters.
                publish_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional.
                start_time:
                  type: string
                  nullable: true
                  description: Optional. Format `H:i:s`.
                end_time:
                  type: string
                  nullable: true
                  description: Optional. Format `H:i:s`.
                capacity:
                  type: integer
                  description: Optional. Minimum 1.
      responses:
        '200':
          description: Batch updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot modify batch after it has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or does not belong to an assessment owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, or a business rule was violated: overlapping batch
            time window ("Batch time conflict"), or renaming this batch to the
            reserved default name while another batch already holds it
            ("Default batch already exists for this assessment").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin Batches]
      summary: Delete a batch
      description: Locked (`403`) once any attempt exists for this batch. Requires admin authentication.
      operationId: adminDeleteBatch
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID.
          schema:
            type: integer
      responses:
        '200':
          description: Batch deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Batch deleted
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot delete batch after it has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or does not belong to an assessment owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/batches/assessment/{assessment_id}:
    get:
      tags: [Admin Batches]
      summary: List the batches belonging to one assessment
      description: Fetch all batches for a specific assessment owned by the authenticated admin.
      operationId: adminListBatchesByAssessment
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID, must be owned by the authenticated admin.
          schema:
            type: integer
      responses:
        '200':
          description: List of batches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/batches/{id}/users:
    get:
      tags: [Admin Batches]
      summary: List users assigned to a batch
      description: >-
        Returns the users currently assigned to this batch. Like every other
        batch endpoint, the batch must belong to an assessment owned by the
        requesting admin (returns `404` otherwise) — an earlier version of
        this endpoint skipped that check, allowing any authenticated admin to
        look up any batch ID; that IDOR has been fixed. Requires admin
        authentication.
      operationId: adminListBatchUsers
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID.
          schema:
            type: integer
      responses:
        '200':
          description: Users fetched successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or its assessment is not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Admin Batches]
      summary: Add users to a batch
      description: >-
        Assigns the given users to this batch (equivalent to calling
        `POST /admin/assignments` with this batch's `assessment_id`/`batch_id`).
        Rejected with `422` if adding them would exceed the batch's `capacity`.
        Users already assigned are not double-counted against capacity. Users
        with a scheduling conflict against another non-flexible assessment on the
        same date/time are silently skipped and reported under
        `blocked_due_to_conflict` in the response rather than causing a failure.
        Locked (`403`) once any attempt exists for this batch. Requires admin authentication.
      operationId: adminAddBatchUsers
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID, must belong to an assessment owned by the authenticated admin.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  description: Required. IDs of existing users to assign to this batch.
                  items:
                    type: integer
      responses:
        '201':
          description: Assignment completed (some users may have been skipped — see `blocked_due_to_conflict`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assignment completed
                  assigned:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssessmentAssignment'
                  blocked_due_to_conflict:
                    type: array
                    description: Users skipped because they already have another non-flexible assessment overlapping this batch's schedule.
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        conflicting_assessment_id:
                          type: integer
                        conflicting_assessment_title:
                          type: string
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot add users after batch has started (an attempt already exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or does not belong to an assessment owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing/invalid user IDs), or adding these users would exceed the batch's capacity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin Batches]
      summary: Remove users from a batch
      description: >-
        Removes the given users' assignments to this batch. Locked (`403`) once
        any attempt exists for this batch. Requires admin authentication.
      operationId: adminRemoveBatchUsers
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID, must belong to an assessment owned by the authenticated admin.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  description: Required. IDs of existing users to unassign from this batch.
                  items:
                    type: integer
      responses:
        '200':
          description: Users unassigned successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Users unassigned successfully
                  deleted_count:
                    type: integer
                    description: Number of assignment rows actually removed.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot remove users after batch has started (an attempt already exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The batch does not exist or does not belong to an assessment owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing/invalid user IDs).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/assessments:
    get:
      tags: [Admin Assessments]
      summary: List all of the admin's assessments
      description: >-
        Returns one row per (assessment, batch) pair for every assessment owned
        by the authenticated admin, newest assessment first. Batch-wise
        assessments with multiple batches appear multiple times.
      operationId: adminListAssessments
      responses:
        '200':
          description: List of assessments with their batch schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Admin Assessments]
      summary: Create an assessment
      description: >-
        Creates a new assessment definition owned by the authenticated admin.
        Scheduling mode is fixed at creation time and cannot be changed later:
        exactly one of `is_batch_wise` / `is_flexible` may be true (both false is
        allowed and means the assessment has a single fixed-schedule batch).
        When neither flag is set, `publish_date`/`start_time`/`end_time` are
        required to seed that single batch. When `is_flexible` is true,
        `duration_minutes` is required. When `is_batch_wise` is false (including
        the flexible case), a default batch named `individual_batch_{id}` is
        auto-created immediately using the schedule fields from this request;
        batch-wise assessments start with no batches — create them separately via
        `POST /admin/batches`. Requires admin authentication.
      operationId: adminCreateAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assessment_type_id
                - title
                - difficulty_level
                - is_batch_wise
              properties:
                assessment_type_id:
                  type: integer
                  description: Required. Must exist in `assessment_types`.
                  example: 1

                title:
                  type: string
                  description: Required. Max 255 characters.
                  example: Math Test

                description:
                  type: string
                  nullable: true
                  description: Optional.

                difficulty_level:
                  type: string
                  description: Required. Free text (e.g. `easy`, `medium`, `hard`) — not validated against a fixed list.
                  example: medium

                shuffle:
                  type: boolean
                  description: Optional. Randomize question order per attempt.
                  example: true

                is_library:
                  type: boolean
                  description: Optional. Marks this as a reusable template assessment.
                  example: false

                is_active:
                  type: boolean
                  description: Optional. Inactive assessments are excluded from upcoming/running/finished listings.
                  example: true

                has_negative:
                  type: boolean
                  description: Optional. Enables negative marking for MCQ auto-grading.
                  example: false

                negative_marks:
                  type: number
                  nullable: true
                  description: Optional. Minimum 0. Marks deducted per wrong MCQ answer when `has_negative` is true.
                  example: 0.5

                is_batch_wise:
                  type: boolean
                  description: Required. See `Assessment.is_batch_wise`. Cannot be true at the same time as `is_flexible`.
                  example: false

                is_flexible:
                  type: boolean
                  description: Optional (defaults false). See `Assessment.is_flexible`. Cannot be true at the same time as `is_batch_wise`.
                  example: false

                publish_date:
                  type: string
                  format: date
                  nullable: true
                  description: Required (unless `is_batch_wise` or `is_flexible` is true). Date the default batch opens.
                  example: "2026-01-30"

                start_time:
                  type: string
                  example: "10:00:00"
                  nullable: true
                  description: Required (unless `is_batch_wise` or `is_flexible` is true). Format `H:i:s`.

                end_time:
                  type: string
                  example: "11:00:00"
                  nullable: true
                  description: Required (unless `is_batch_wise` or `is_flexible` is true). Format `H:i:s`.

                expiry_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. Only meaningful when `is_flexible` is true — last day the default batch can be attempted.
                  example: "2026-02-05"

                duration_minutes:
                  type: integer
                  nullable: true
                  description: Required when `is_flexible` is true. Minimum 1. Per-attempt time limit on the default batch.
                  example: 60

      responses:
        '201':
          description: Assessment created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assessment created successfully
                  data:
                    $ref: '#/components/schemas/Assessment'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, or a scheduling business rule was violated:
            both `is_batch_wise` and `is_flexible` true, missing
            publish/start/end time for fixed-schedule assessments, or missing
            `duration_minutes` for flexible assessments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/assessments/{id}:
    get:
      tags: [Admin Assessments]
      summary: Get one assessment with its batches
      description: Retrieve a single assessment owned by the authenticated admin, together with all of its batches.
      operationId: adminGetAssessment
      parameters:
        - name: id
          in: path
          required: true
          description: Assessment ID.
          schema:
            type: integer
      responses:
        '200':
          description: Assessment details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Assessment'
                  - type: object
                    properties:
                      batches:
                        type: array
                        items:
                          $ref: '#/components/schemas/Batch'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Admin Assessments]
      summary: Update an assessment
      description: >-
        Partial update — omitted fields keep their current value. Locked
        (`403`) once any attempt exists for this assessment. `is_batch_wise` and
        `is_flexible` cannot be changed from their original value (`422` if a
        different value is supplied); the required-schedule-fields rule from
        create is re-checked against the merged values whenever the corresponding
        field is explicitly included in the request. Requires admin authentication.
      operationId: adminUpdateAssessment
      parameters:
        - name: id
          in: path
          required: true
          description: Assessment ID.
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assessment_type_id:
                  type: integer
                  description: Optional. Must exist in `assessment_types`.
                  example: 1

                title:
                  type: string
                  description: Optional. Max 255 characters.
                  example: Math Test

                description:
                  type: string
                  nullable: true
                  description: Optional.

                difficulty_level:
                  type: string
                  nullable: true
                  description: Optional. Free text — not validated against a fixed list.
                  example: medium

                shuffle:
                  type: boolean
                  description: Optional.
                  example: true

                is_library:
                  type: boolean
                  description: Optional.
                  example: false

                is_active:
                  type: boolean
                  description: Optional.
                  example: true

                has_negative:
                  type: boolean
                  description: Optional.
                  example: false

                negative_marks:
                  type: number
                  nullable: true
                  description: Optional. Minimum 0.
                  example: 0.5

                is_batch_wise:
                  type: boolean
                  description: Optional, but the value must match the assessment's current value — changing it returns `422`.
                  example: false

                is_flexible:
                  type: boolean
                  description: Optional, but the value must match the assessment's current value — changing it returns `422`.
                  example: false

                publish_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. Updates the default batch's publish date (non-batch-wise assessments only).
                  example: "2026-01-30"

                start_time:
                  type: string
                  nullable: true
                  example: "10:00:00"
                  description: Optional. Format `H:i:s`. Updates the default batch's start time (non-batch-wise assessments only).

                end_time:
                  type: string
                  nullable: true
                  example: "11:00:00"
                  description: Optional. Format `H:i:s`. Updates the default batch's end time (non-batch-wise assessments only).

                expiry_date:
                  type: string
                  format: date
                  nullable: true
                  description: Optional. Updates the default batch's expiry date (non-batch-wise, flexible assessments only).
                  example: "2026-02-05"

                duration_minutes:
                  type: integer
                  nullable: true
                  description: Optional. Minimum 1. Cannot be explicitly cleared while `is_flexible` is true.
                  example: 60

      responses:
        '200':
          description: Assessment updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assessment updated successfully
                  data:
                    $ref: '#/components/schemas/Assessment'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot modify assessment after it has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            Validation failed, an attempt to change `is_batch_wise`/`is_flexible`,
            or a required schedule field was cleared for the assessment's scheduling mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Admin Assessments]
      summary: Delete an assessment
      description: Locked (`403`) once any attempt exists for this assessment. Requires admin authentication.
      operationId: adminDeleteAssessment
      parameters:
        - name: id
          in: path
          required: true
          description: Assessment ID.
          schema:
            type: integer
      responses:
        '200':
          description: Assessment deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assessment deleted successfully
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot delete assessment after it has been attempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not found or not owned by the authenticated admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

