  /admin/dashboard:
    get:
      tags: [Admin Dashboard]
      summary: Full admin dashboard
      description: >-
        Single aggregate endpoint for the admin dashboard. Returns assessment, batch,
        candidate and attempt counters together with the score distribution, top
        performers, next scheduled batches, latest attempts and the manual-grading
        queue. Everything is scoped to assessments owned by the authenticated admin.
      parameters:
        - name: limit
          in: query
          required: false
          description: Size of each embedded list (default 5, max 50)
          schema:
            type: integer
            default: 5
            maximum: 50

      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments:
                    type: object
                    properties:
                      total:
                        type: integer
                      active:
                        type: integer
                      library:
                        type: integer
                      batch_wise:
                        type: integer
                      flexible:
                        type: integer
                      by_type:
                        type: object
                        description: Assessment count keyed by assessment type slug
                        additionalProperties:
                          type: integer
                        example:
                          mcq: 8
                          descriptive: 2

                  batches:
                    type: object
                    properties:
                      total:
                        type: integer
                      upcoming:
                        type: integer
                      running:
                        type: integer
                      finished:
                        type: integer

                  questions:
                    type: integer

                  candidates:
                    type: integer
                    description: Distinct users assigned to the admin's assessments

                  assignments:
                    type: integer
                    description: Total assignment rows across the admin's assessments

                  attempts:
                    type: object
                    properties:
                      total:
                        type: integer
                      in_progress:
                        type: integer
                        description: Started but not submitted
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                        description: Submitted, awaiting manual grading
                      evaluated:
                        type: integer
                      completion_rate:
                        type: number
                        description: Submitted attempts as a percentage of assignments

                  average_percentage:
                    type: number
                    description: Mean percentage over evaluated attempts, 0 when none

                  score_distribution:
                    type: object
                    description: Evaluated attempt counts per percentage band
                    properties:
                      '0-39':
                        type: integer
                      '40-59':
                        type: integer
                      '60-79':
                        type: integer
                      '80-100':
                        type: integer

                  top_performers:
                    type: array
                    description: Highest average scorers, best first
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        attempts:
                          type: integer
                        average_percentage:
                          type: number

                  upcoming_batches:
                    type: array
                    description: Next scheduled batches, soonest first
                    items:
                      type: object
                      properties:
                        batch_id:
                          type: integer
                        batch_name:
                          type: string
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                        publish_date:
                          type: string
                          format: date
                          nullable: true
                        start_time:
                          type: string
                          nullable: true
                          example: '09:00:00'
                        end_time:
                          type: string
                          nullable: true
                          example: '10:30:00'
                        capacity:
                          type: integer
                          nullable: true

                  recent_attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        started_at:
                          type: string
                          nullable: true
                          example: '17:22:47'
                        submitted_at:
                          type: string
                          nullable: true
                          example: '18:36:09'
                        status:
                          type: string
                          enum: [in_progress, pending_evaluation, evaluated]
                        score:
                          type: number
                          nullable: true
                          description: Null unless the attempt is submitted and evaluated
                        total_marks:
                          type: integer
                          nullable: true
                        percentage:
                          type: number
                          nullable: true

                  pending_evaluations:
                    type: array
                    description: Submitted attempts still waiting on manual grading
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        user_id:
                          type: integer
                        user_name:
                          type: string
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
        '401':
          description: Unauthenticated

