openapi: 3.0.0

info:
  title: Auth API
  description: Admin & User authentication APIs (Laravel Passport)
  version: 1.0.0

servers:
  - url: http://192.168.0.142:8000/web/v1
    description: Web (Cookies + CSRF)
  - url: http://192.168.0.142:8000/api/v1
    description: Mobile apps (Bearer token)

  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/web/v1
    description: Production Web
  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/api/v1
    description: Production Mobile

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Admin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        admin:
          $ref: '#/components/schemas/Admin'

    UserAuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

security:
  - BearerAuth: []

paths:
  # -------------------------------------------------------- Admin --------------------------------------------------------
  /admin/register:
    security: []
    post:
      tags: [Admin Auth]
      summary: Register admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Admin created

  /admin/login:
    security: []
    post:
      tags: [Admin Auth]
      summary: Login admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
        '401':
          description: Invalid credentials

  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Get logged-in admin
      responses:
        '200':
          description: Admin profile
        '401':
          description: Unauthenticated

  /admin/logout:
    post:
      tags: [Admin Auth]
      summary: Logout admin
      responses:
        '200':
          description: Logged out
  
  /admin/users:
    get:
      tags: [Admin Users]
      summary: Get all users
      description: Retrieve all users for admin view
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string
        401:
          description: Unauthenticated

    post:
      tags: [Admin Users]
      summary: Create user
      description: Create a new user and auto verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
        401:
          description: Unauthenticated


  /admin/assessments:
    get:
      tags: [Admin Assessments]
      summary: Get all assessments
      responses:
        200:
          description: List of assessments

    post:
      tags: [Admin Assessments]
      summary: Create assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_type_id, title]
              properties:
                assessment_type_id:
                  type: integer
                title:
                  type: string
                description:
                  type: string
                publish_date:
                  type: string
                start_time:
                  type: string
                end_time:
                  type: string
                shuffle:
                  type: boolean
                is_library:
                  type: boolean
                is_active:
                  type: boolean
                has_negative:
                  type: boolean
                negative_marks:
                  type: number
      responses:
        201:
          description: Assessment created

  /admin/assessments/{id}:
    get:
      tags: [Admin Assessments]
      summary: Get assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Assessment details

    put:
      tags: [Admin Assessments]
      summary: Update assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assessment_type_id:
                  type: integer
                  example: 1
                title:
                  type: string
                  example: Math Test
                description:
                  type: string
                  example: Final exam
                publish_date:
                  type: string
                  example: "2026-01-30"
                start_time:
                  type: string
                  example: "10:00:00"
                end_time:
                  type: string
                  example: "11:00:00"
                shuffle:
                  type: boolean
                  example: true
                is_library:
                  type: boolean
                  example: false
                is_active:
                  type: boolean
                  example: true
                has_negative:
                  type: boolean
                  example: true
                negative_marks:
                  type: number
                  example: 0.5
      responses:
        200:
          description: Assessment updated

    delete:
      tags: [Admin Assessments]
      summary: Delete assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Assessment deleted

  /admin/assessments/library:
    get:
      tags: [Admin Assessments]
      summary: Get library assessments
      responses:
        200:
          description: List of library assessments
  
  /admin/assessments/upcoming:
    get:
      tags: [Admin Assessments]
      summary: Get upcoming assessments (today, not started yet)
      responses:
        200:
          description: List of upcoming assessments

  /admin/assessments/running:
    get:
      tags: [Admin Assessments]
      summary: Get currently running assessments
      responses:
        200:
          description: List of running assessments

  /admin/assessment-types:
    get:
      tags: [Admin Assessment Types]
      summary: List assessment types
      responses:
        '200':
          description: List of assessment types

    post:
      tags: [Admin Assessment Types]
      summary: Create assessment type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Assessment type created

  /admin/assessment-types/{id}:
    get:
      tags: [Admin Assessment Types]
      summary: Get single assessment type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assessment type details
        '404':
          description: Not found

    put:
      tags: [Admin Assessment Types]
      summary: Update assessment type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Assessment type updated

    delete:
      tags: [Admin Assessment Types]
      summary: Delete assessment type
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assessment type deleted

  /admin/assessments/{assessment_id}/questions:
    get:
      tags: [Admin Assessment Questions]
      summary: Get questions
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of questions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

    post:
      tags: [Admin Assessment Questions]
      summary: Create question
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, question_text]
              properties:
                type:
                  type: string
                question_text:
                  type: string
                order:
                  type: integer
      responses:
        201:
          description: Question created
          content:
            application/json:
              schema:
                type: object

  /admin/questions/{id}:
    put:
      tags: [Admin Assessment Questions]
      summary: Update question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                question_text:
                  type: string
                order:
                  type: integer
      responses:
        200:
          description: Question updated
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Admin Assessment Questions]
      summary: Delete question
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Question deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /admin/assessments/{assessment_id}/questions/with-choices:
    get:
      tags: [Admin Assessment Questions]
      summary: List questions with choices
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of questions with choices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      tags: [Admin Assessment Questions]
      summary: Create question with 4 choices
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, question_text, choices]
              properties:
                type:
                  type: string
                question_text:
                  type: string
                order:
                  type: integer
                choices:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    required: [option, is_correct]
                    properties:
                      option:
                        type: string
                      is_correct:
                        type: boolean
                      order:
                        type: integer
      responses:
        201:
          description: Question with choices created
          content:
            application/json:
              schema:
                type: object


  /admin/questions/{id}/with-choices:
    get:
      tags: [Admin Assessment Questions]
      summary: Get single question with choices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Question with choices
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [Admin Assessment Questions]
      summary: Update question with 4 choices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, question_text, choices]
              properties:
                type:
                  type: string
                question_text:
                  type: string
                order:
                  type: integer
                choices:
                  type: array
                  minItems: 4
                  maxItems: 4
                  items:
                    type: object
                    required: [option, is_correct]
                    properties:
                      option:
                        type: string
                      is_correct:
                        type: boolean
                      order:
                        type: integer
      responses:
        200:
          description: Question with choices updated
          content:
            application/json:
              schema:
                type: object

  /admin/questions/{question_id}/choices:
    get:
      tags: [Admin Assessment Choices]
      summary: Get choices
      parameters:
        - name: question_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of choices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

    post:
      tags: [Admin Assessment Choices]
      summary: Create choice
      parameters:
        - name: question_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option]
              properties:
                option:
                  type: string
                is_correct:
                  type: boolean
                order:
                  type: integer
      responses:
        201:
          description: Choice created
          content:
            application/json:
              schema:
                type: object

  /admin/choices/{id}:
    put:
      tags: [Admin Assessment Choices]
      summary: Update choice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                option:
                  type: string
                is_correct:
                  type: boolean
                order:
                  type: integer
      responses:
        200:
          description: Choice updated
          content:
            application/json:
              schema:
                type: object

    delete:
      tags: [Admin Assessment Choices]
      summary: Delete choice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Choice deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /admin/assignments/users-with-assignment-status:
    get:
      tags: [Admin Assessment Assignments]
      summary: Get all users with assignment status for an assessment
      parameters:
        - name: assessment_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of users with assignment status
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                    name:
                      type: string
                    assigned:
                      type: boolean
        404:
          description: Assessment not found or not owned by admin
        422:
          description: Validation error


  /admin/assignments:
    post:
      tags: [Admin Assessment Assignments]
      summary: Assign assessment to multiple users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id, user_ids]
              properties:
                assessment_id:
                  type: integer
                user_ids:
                  type: array
                  items:
                    type: integer
      responses:
        201:
          description: Assessment assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  assignments:
                    type: array
                    items:
                      type: object

    delete:
      tags: [Admin Assessment Assignments]
      summary: Remove assessment assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessment_id, user_ids]
              properties:
                assessment_id:
                  type: integer
                  example: 0
                user_ids:
                  type: array
                  minItems: 1
                  items:
                    type: integer
      responses:
        200:
          description: Assignments removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deleted_count:
                    type: integer

  /admin/results/finished:
    get:
      tags: [Admin Assessment Results]
      summary: Get finished assessments
      responses:
        200:
          description: List of finished assessments

  /admin/results/{assessment_id}/users:
    get:
      tags: [Admin Assessment Results]
      summary: Get users assigned to an assessment with attempt status
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: List of users with attempted flag

  /admin/results/{assessment_id}/user/{user_id}:
    get:
      tags: [Admin Assessment Results]
      summary: Get result of a specific user for an assessment
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User result details
        400:
          description: User has not submitted the assessment

  # -------------------------------------------------------- User --------------------------------------------------------
  /user/register:
    security: []
    post:
      tags: [User Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string

      responses:
        '201':
          description: User created

  /user/send-verification-code:
    security: []
    post:
      tags: [User Auth]
      summary: Send email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Verification code sent

  /user/verify-email:
    security: []
    post:
      tags: [User Auth]
      summary: Verify email using OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Email verified

  /user/login:
    security: []
    post:
      tags: [User Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        '200':
          description: Success

  /user/me:
    get:
      tags: [User Auth]
      summary: Get logged-in user
      responses:
        '200':
          description: User profile

  /user/logout:
    post:
      tags: [User Auth]
      summary: Logout user
      responses:
        '200':
          description: Logged out

  /user/assessments:
    get:
      tags: [User Assessments]
      summary: List all assessments assigned to user
      responses:
        '200':
          description: List of assessments

  /user/assessments/upcoming:
    get:
      tags: [User Assessments]
      summary: Get upcoming assessments (not started yet today)
      responses:
        '200':
          description: List of upcoming assessments

  /user/assessments/running:
    get:
      tags: [User Assessments]
      summary: Get currently running assessments
      responses:
        '200':
          description: List of running assessments

  /user/assessments/{id}:
    get:
      tags: [User Assessments]
      summary: Get single assessment (only if assigned)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assessment details
        '404':
          description: Assessment not found or not assigned

  /user/assessments/{id}/start:
    post:
      tags: [User Assessment Attempts]
      summary: Start an assessment (create attempt)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Assessment started
        '200':
          description: Assessment already started
        '403':
          description: Assessment not currently available
        '404':
          description: Assessment not assigned or not found

  /user/assessments/{id}/submit:
    post:
      tags: [User Assessment Attempts]
      summary: Submit assessment and calculate result
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assessment submitted successfully with score
        '400':
          description: Assessment already submitted
        '404':
          description: Attempt or assessment not found
        '422':
          description: Unsupported assessment type
  
  /user/assessments/{id}/result:
    post:
      tags: [User Assessment Results]
      summary: Get assessment result with paginated questions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Assessment result with score and question breakdown
        '400':
          description: Assessment not submitted yet
        '404':
          description: Attempt not found
  
  /user/assessments/{id}/questions:
    get:
      tags: [User Assessment Questions]
      summary: Get assessment questions (only if started and running)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of questions with choices
        '403':
          description: Assessment is not currently running
        '404':
          description: Attempt not found or assessment not found
  
  /user/assessments/{id}/answer:
    post:
      tags: [User Assessment Answers]
      summary: Save or update answer for a question (type-aware)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, choice_id]
              properties:
                question_id:
                  type: integer
                choice_id:
                  type: integer
                answer:
                  type: string
      responses:
        '200':
          description: Answer saved
        '403':
          description: Assessment already submitted
        '404':
          description: Attempt, question, or choice not found
        '422':
          description: Unsupported assessment type

  /user/notifications:
    get:
      tags: [User Notifications]
      summary: Get all notifications for logged-in user
      responses:
        200:
          description: List of notifications

  /user/notifications/read-all:
    post:
      tags: [User Notifications]
      summary: Mark all notifications as read
      responses:
        200:
          description: All notifications marked as read
