      responses:
        '200':
          description: Per-answer report
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  totals:
                    type: object
                    properties:
                      answers:
                        type: integer
                      graded:
                        type: integer
                      correct:
                        type: integer
                      wrong:
                        type: integer
                      accuracy:
                        type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportQuestionRow'
                  current_page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          description: Unauthenticated
        '422':
          description: Invalid filter values

  /user/reports/progress:
    get:
      tags: [User Reports]
      summary: Evaluated attempts over time with a running average
      description: >-
        Chronological list of evaluated attempts, each carrying the cumulative average
        up to that point, plus an overall trend (last percentage minus first).
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPage'
        - $ref: '#/components/parameters/ReportPageSize'
      responses:
        '200':
          description: Progress report
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  trend:
