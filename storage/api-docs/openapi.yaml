openapi: 3.0.0

info:
  title: Auth API
  description: Admin & User authentication APIs (Laravel Passport)
  version: 1.0.0

servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Mobile apps (Bearer token)
  - url: http://127.0.0.1:8000/web/v1
    description: Web (Cookies + CSRF)

  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/web/v1
    description: Production Web
  - url: https://seashell-okapi-169452.hostingersite.com/ems/public/api/v1
    description: Production Mobile

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ReportAssessmentId:
      name: assessment_id
      in: query
      required: false
      description: Restrict the report to a single assessment
      schema:
        type: integer

    ReportBatchId:
      name: batch_id
      in: query
      required: false
      description: Restrict the report to a single batch
      schema:
        type: integer

    ReportUserId:
      name: user_id
      in: query
      required: false
      description: Restrict the report to a single candidate
      schema:
        type: integer

    ReportAssessmentType:
      name: assessment_type
      in: query
      required: false
      description: Assessment type slug, e.g. mcq or descriptive
      schema:
        type: string

    ReportStatus:
      name: status
      in: query
      required: false
      description: Restrict to attempts in a given state
      schema:
        type: string
        enum: [in_progress, pending_evaluation, evaluated]

    ReportPassingPercentage:
      name: passing_percentage
      in: query
      required: false
      description: Threshold used for pass/fail, defaults to 40
      schema:
        type: number
        default: 40
        minimum: 0
        maximum: 100

    ReportFrom:
      name: from
      in: query
      required: false
      description: >-
        Start of the date range. Applied to the attempt's created_at, because
        started_at and submitted_at are TIME columns with no date component.
      schema:
        type: string
        format: date

    ReportTo:
      name: to
      in: query
      required: false
      description: End of the date range, must be on or after `from`
      schema:
        type: string
        format: date

    ReportPage:
      name: page
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        default: 1
        minimum: 1

    ReportPageSize:
      name: page_size
      in: query
      required: false
      description: Rows per page (max 200)
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 200

  schemas:
    ReportFilters:
      type: object
      description: The filters that were actually supplied on the request, empty object when none
      additionalProperties: true

    ReportPerformance:
      type: object
      description: Score aggregates over the matching evaluated attempts
      properties:
        evaluated:
          type: integer
        average_percentage:
          type: number
        highest_percentage:
          type: number
        lowest_percentage:
          type: number
        passed:
          type: integer
        failed:
          type: integer
        pass_rate:
          type: number

    ReportScoreDistribution:
      type: object
      description: Evaluated attempt counts per percentage band
      properties:
        '0-39':
          type: integer
        '40-59':
          type: integer
        '60-79':
          type: integer
        '80-100':
          type: integer

    AdminReportAssessmentRow:
      allOf:
        - type: object
          properties:
            assessment_id:
              type: integer
            title:
              type: string
            type:
              type: string
              nullable: true
            difficulty_level:
              type: string
              nullable: true
            is_active:
              type: boolean
            is_batch_wise:
              type: boolean
            is_flexible:
              type: boolean
            questions:
              type: integer
            batches:
              type: integer
            assigned:
              type: integer
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportBatchRow:
      allOf:
        - type: object
          properties:
            batch_id:
              type: integer
            batch_name:
              type: string
            assessment_id:
              type: integer
            assessment_title:
              type: string
              nullable: true
            status:
              type: string
              nullable: true
              enum: [upcoming, running, finished, unscheduled]
            publish_date:
              type: string
              format: date
              nullable: true
            start_time:
              type: string
              nullable: true
            end_time:
              type: string
              nullable: true
            expiry_date:
              type: string
              format: date
              nullable: true
            duration_minutes:
              type: integer
              nullable: true
            capacity:
              type: integer
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            submitted:
              type: integer
            participation_rate:
              type: number
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportUserRow:
      allOf:
        - type: object
          properties:
            user_id:
              type: integer
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    AdminReportQuestionRow:
      type: object
      properties:
        question_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        question_text:
          type: string
        type:
          type: string
          nullable: true
        order:
          type: integer
          nullable: true
        answered:
          type: integer
        correct:
          type: integer
        wrong:
          type: integer
        ungraded:
          type: integer
          description: Answers still awaiting manual grading
        accuracy:
          type: number
          nullable: true
          description: correct / graded as a percentage, null when nothing is graded
        difficulty:
          type: string
          enum: [easy, medium, hard, not_attempted]
          description: Derived from accuracy — easy >= 80, medium >= 50, else hard

    AdminReportAttemptRow:
      type: object
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        batch_name:
          type: string
          nullable: true
        user_id:
          type: integer
        user_name:
          type: string
          nullable: true
        user_email:
          type: string
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
        started_at:
          type: string
          nullable: true
          example: '17:22:47'
        submitted_at:
          type: string
          nullable: true
          example: '18:36:09'
        status:
          type: string
          enum: [in_progress, pending_evaluation, evaluated]
        score:
          type: number
          nullable: true
        total_marks:
          type: integer
          nullable: true
        percentage:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true
          description: Null until the attempt is evaluated

    UserReportAssessmentRow:
      allOf:
        - type: object
          properties:
            assessment_id:
              type: integer
            assessment_title:
              type: string
              nullable: true
            type:
              type: string
              nullable: true
            assigned:
              type: integer
            attempts:
              type: integer
            in_progress:
              type: integer
            submitted:
              type: integer
            pending_evaluation:
              type: integer
        - $ref: '#/components/schemas/ReportPerformance'

    UserReportAttemptRow:
      type: object
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        batch_name:
          type: string
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
        started_at:
          type: string
          nullable: true
        submitted_at:
          type: string
          nullable: true
        status:
          type: string
          enum: [in_progress, pending_evaluation, evaluated]
        score:
          type: number
          nullable: true
        total_marks:
          type: integer
          nullable: true
        percentage:
          type: number
          nullable: true
        passed:
          type: boolean
          nullable: true

    UserReportQuestionRow:
      type: object
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
          nullable: true
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        question_id:
          type: integer
        question_text:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        order:
          type: integer
          nullable: true
        answer:
          nullable: true
          description: The stored answer payload, shape depends on the assessment type
        is_correct:
          type: boolean
          nullable: true
          description: Null while the answer is not yet graded
        graded:
          type: boolean

    UserReportProgressRow:
      type: object
      properties:
        attempt_id:
          type: integer
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        attempt_date:
          type: string
          format: date
          nullable: true
        submitted_at:
          type: string
          nullable: true
        score:
          type: number
        total_marks:
          type: integer
        percentage:
          type: number
        passed:
          type: boolean
        running_average:
          type: number
          description: Cumulative average percentage up to and including this attempt

    Admin:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        admin:
          $ref: '#/components/schemas/Admin'

    UserAuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    UserDashboardAssessment:
      type: object
      description: An assessment row on the user dashboard, with its batch schedule
      properties:
        assessment_id:
          type: integer
        assessment_title:
          type: string
          nullable: true
        batch_id:
          type: integer
          nullable: true
        publish_date:
          type: string
          format: date
          nullable: true
        start_time:
          type: string
          nullable: true
          example: '09:00:00'
        end_time:
          type: string
          nullable: true
          example: '10:30:00'
        expiry_date:
          type: string
          format: date
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        is_flexible:
          type: boolean

security:
  - BearerAuth: []

paths:
  # -------------------------------------------------------- Admin --------------------------------------------------------
  /admin/register:
    post:
      tags: [Admin Auth]
      summary: Register admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Admin created

  /admin/login:
    post:
      tags: [Admin Auth]
      summary: Login admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
        '401':
          description: Invalid credentials

  /admin/me:
    get:
      tags: [Admin Auth]
      summary: Get logged-in admin
      responses:
        '200':
          description: Admin profile
        '401':
          description: Unauthenticated

  /admin/logout:
    post:
      tags: [Admin Auth]
      summary: Logout admin
      responses:
        '200':
          description: Logged out
  
  /admin/users:
    get:
      tags: [Admin Users]
      summary: Get all users
      description: Retrieve all users for admin view
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string
        401:
          description: Unauthenticated

    post:
      tags: [Admin Users]
      summary: Create user
      description: Create a new user and auto verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
        401:
          description: Unauthenticated

  /admin/users/bulk-assign:
    post:
      tags: [Admin Users]
      summary: Bulk upload users via CSV or Excel
      description: Upload a CSV/XLSX file to create multiple users at once
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or Excel file containing user data

      responses:
        200:
          description: Bulk upload completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Bulk upload completed

                  inserted:
                    type: integer
                    example: 25

                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:
                          type: integer
                          example: 2
                        error:
                          type: string
                          example: Invalid email

        400:
          description: File is empty

        422:
          description: Validation error (invalid file type)

  /admin/batches:
    get:
      tags: [Admin Batches]
      summary: Get all batches
      description: Retrieve all batches for admin view
      responses:
        200:
          description: List of batches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    publish_date:
                      type: string
                      format: date
                    start_time:
                      type: string
                      format: time
                    end_time:
                      type: string
                      format: time
                    assessment_id:
                      type: integer
                    capacity:
                      type: integer
                    user_ids:
                      type: array
                      items:
                        type: integer
        401:
          description: Unauthenticated

    post:
      tags: [Admin Batches]
      summary: Create batch
      description: Create a new batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, assessment_id, capacity]
              properties:
                name:
                  type: string
                publish_date:
                  type: string
                  format: date
                start_time:
                  type: string
                  format: time
                end_time:
                  type: string
                  format: time
                assessment_id:
                  type: integer
                capacity:
                  type: integer
      responses:
        201:
          description: Batch created
        401:
          description: Unauthenticated

  /admin/batches/{id}:
    get:
      tags: [Admin Batches]
      summary: Get batch
      description: Retrieve a single batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Batch details
        401:
          description: Unauthenticated

    put:
      tags: [Admin Batches]
      summary: Update batch
      description: Update an existing batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                publish_date:
                  type: string
                  format: date
                start_time:
                  type: string
                  format: time
                end_time:
                  type: string
                  format: time
                assessment_id:
                  type: integer
                capacity:
                  type: integer
      responses:
        200:
          description: Batch updated
        401:
          description: Unauthenticated

    delete:
      tags: [Admin Batches]
      summary: Delete batch
      description: Delete a batch by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Batch deleted
        401:
          description: Unauthenticated
          
  /admin/batches/assessment/{assessment_id}:
    get:
      tags: [Admin Batches]
      summary: Get batches by assessment
      description: Fetch all batches belonging to a specific assessment owned by the admin
      parameters:
        - name: assessment_id
          in: path
          required: true
          description: Assessment ID
          schema:
            type: integer
      responses:
        200:
          description: List of batches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "Batch A"
                    assessment_id:
                      type: integer
                      example: 10
                    publish_date:
                      type: string
                      format: date
                      nullable: true
                    start_time:
                      type: string
                      nullable: true
                    end_time:
                      type: string
                      nullable: true

        404:
          description: Assessment not found or not owned by admin

  /admin/batches/{id}/users:
    get:
      tags: [Admin Batches]
      summary: Get users from batch
      description: Get users assigned to a specific batch
      parameters:
        - name: id
          in: path
          required: true
          description: Batch ID
          schema:
            type: integer
      responses:
        200:
          description: Users fetched successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: "John Doe"

    post:
      tags: [Admin Batches]
      summary: Add users to batch
      description: Add multiple users to a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: Users added to batch
        422:
          description: Capacity exceeded or validation error
        401:
          description: Unauthenticated

    delete:
      tags: [Admin Batches]
      summary: Remove users from batch
      description: Remove users from a batch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: Users removed from batch
        401:
          description: Unauthenticated

  /admin/assessments:
    get:
      tags: [Admin Assessments]
      summary: Get all assessments
      responses:
        200:
          description: List of assessments

    post:
      tags: [Admin Assessments]
      summary: Create assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assessment_type_id
                - title
                - difficulty_level
                - is_batch_wise
              properties:
                assessment_type_id:
                  type: integer
                  example: 1

                title:
                  type: string
                  example: Math Test

                description:
                  type: string
                  nullable: true

                difficulty_level:
                  type: string
                  example: medium

                shuffle:
                  type: boolean
                  example: true

                is_library:
                  type: boolean
                  example: false

                is_active:
                  type: boolean
                  example: true

                has_negative:
                  type: boolean
                  example: false

                negative_marks:
                  type: number
                  nullable: true
                  example: 0.5

                is_batch_wise:
                  type: boolean
                  example: false

                is_flexible:
                  type: boolean
                  example: false

                publish_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-01-30"

                start_time:
                  type: string
                  example: "10:00:00"
                  nullable: true

                end_time:
                  type: string
                  example: "11:00:00"
                  nullable: true

                expiry_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-02-05"

                duration_minutes:
                  type: integer
                  nullable: true
                  example: 60

      responses:
        201:
          description: Assessment created


  /admin/assessments/{id}:
    get:
      tags: [Admin Assessments]
      summary: Get assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Assessment details

    put:
      tags: [Admin Assessments]
      summary: Update assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assessment_type_id:
                  type: integer
                  example: 1

                title:
                  type: string
                  example: Math Test

                description:
                  type: string
                  nullable: true

                difficulty_level:
                  type: string
                  example: medium

                shuffle:
                  type: boolean
                  example: true

                is_library:
                  type: boolean
                  example: false

                is_active:
                  type: boolean
                  example: true

                has_negative:
                  type: boolean
                  example: false

                negative_marks:
                  type: number
                  nullable: true
                  example: 0.5

                is_batch_wise:
                  type: boolean
                  example: false

                is_flexible:
                  type: boolean
                  example: false

                publish_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-01-30"

                start_time:
                  type: string
                  nullable: true
                  example: "10:00:00"

                end_time:
                  type: string
                  nullable: true
                  example: "11:00:00"

                expiry_date:
                  type: string
                  format: date
                  nullable: true
                  example: "2026-02-05"

                duration_minutes:
                  type: integer
                  nullable: true
                  example: 60

      responses:
        200:
          description: Assessment updated

    delete:
      tags: [Admin Assessments]
      summary: Delete assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Assessment deleted


  /admin/assessments/library:
    get:
      tags: [Admin Assessments]
      summary: Get library assessments
      responses:
        200:
          description: List of library assessments


  /admin/assessments/upcoming:
    get:
      tags: [Admin Assessments]
      summary: Get upcoming assessments
      responses:
        200:
          description: List of upcoming assessments


  /admin/assessments/running:
    get:
      tags: [Admin Assessments]
      summary: Get currently running assessments
      responses:
        200:
          description: List of running assessments

  /admin/assessment-types:
    get:
      tags: [Admin Assessment Types]
      summary: List assessment types
      responses:
        '200':
          description: List of assessment types

  /admin/assessments/{assessment_id}/questions:
    get:
      tags: [Admin Assessment Questions]
      summary: Get questions
      parameters:
        - name: assessment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
