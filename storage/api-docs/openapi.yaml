  # -------------------------------------------------------- User --------------------------------------------------------
  /user/register:
    post:
      tags: [User Auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string

      responses:
        '201':
          description: User created

  /user/send-verification-code:
    post:
      tags: [User Auth]
      summary: Send email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Verification code sent

  /user/verify-email:
    post:
      tags: [User Auth]
      summary: Verify email using OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Email verified

  /user/login:
    post:
      tags: [User Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        '200':
          description: Success

  /user/me:
    get:
      tags: [User Auth]
      summary: Get logged-in user
      responses:
        '200':
          description: User profile

  /user/logout:
    post:
      tags: [User Auth]
      summary: Logout user
      responses:
        '200':
          description: Logged out

  # Assessments
  /user/assessments/upcoming:
    get:
      tags: [User Assessments]
      summary: Upcoming assessments
      description: List all assessments assigned to the user (regardless of date)
      responses:
        200:
          description: List of upcoming assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        401:
          description: Unauthorized

  /user/assessments/today:
    get:
      tags: [User Assessments]
      summary: Today's assessments
      description: Assessments scheduled for today but not yet started
      responses:
        200:
          description: List of today's assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        401:
          description: Unauthorized

  /user/assessments/running:
    get:
      tags: [User Assessments]
      summary: Running assessments
      description: Assessments the user can take right now
      responses:
        200:
          description: List of running assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        401:
          description: Unauthorized

  /user/assessments/completed:
    get:
      tags: [User Assessments]
      summary: Completed assessments
      description: Assessments already attempted by the user
      responses:
        200:
          description: List of completed assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        401:
          description: Unauthorized

  /user/assessments/missed:
    get:
      tags: [User Assessments]
      summary: Missed assessments
      description: >
        Assessments whose time window has passed
        and were not attempted by the user
      responses:
        200:
          description: List of missed assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        401:
          description: Unauthorized

  /user/assessments/{id}:
    get:
      tags: [User Assessments]
      summary: Get assigned assessment
      description: >
        Retrieve a single assessment only if it is assigned to the authenticated user.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Assessment ID
      responses:
        200:
          description: Assigned assessment details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  topic_id:
                    type: integer
                  assessment_type_id:
                    type: integer
                  title:
                    type: string
                  description:
                    type: string
                    nullable: true
                  publish_date:
                    type: string
                    format: date
                  start_time:
                    type: string
                    format: time
                  end_time:
                    type: string
                    format: time
                  is_active:
                    type: boolean
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        401:
          description: Unauthorized
        404:
          description: Assessment not assigned to user


  /user/assessments/{assessment_id}/start:
    post:
      tags: [User Assessment Attempts]
      summary: Start an assessment (create attempt)
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Assessment started
        '200':
          description: Assessment already started
        '403':
          description: Assessment not currently available
        '404':
          description: Assessment not assigned or not found

  /user/assessments/{assessment_id}/submit:
    post:
      tags: [User Assessment Attempts]
      summary: Submit assessment and calculate result
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assessment submitted successfully with score
        '400':
          description: Assessment already submitted
        '404':
          description: Attempt or assessment not found
        '422':
          description: Unsupported assessment type
  
  /user/assessments/{assessment_id}/result:
    post:
      tags: [User Assessment Results]
      summary: Get assessment result with paginated questions
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Assessment result with score and question breakdown
        '400':
          description: Assessment not submitted yet
        '404':
          description: Attempt not found
  
  /user/assessments/{assessment_id}/questions:
    get:
      tags: [User Assessment Questions]
      summary: Get assessment questions (only if started and running)
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of questions with choices
        '403':
          description: Assessment is not currently running
        '404':
          description: Attempt not found or assessment not found
  
  /user/assessments/{assessment_id}/answer:
    post:
      tags: [User Assessment Answers]
      summary: Save or update answer for a question (type-aware)
      parameters:
        - in: path
          name: assessment_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, choice_id]
              properties:
                question_id:
                  type: integer
                choice_id:
                  type: integer
                answer:
                  type: string
      responses:
        '200':
          description: Answer saved
        '403':
          description: Assessment already submitted
        '404':
          description: Attempt, question, or choice not found
        '422':
          description: Unsupported assessment type

  /user/notifications:
    get:
      tags: [User Notifications]
      summary: Get all notifications for logged-in user
      responses:
        200:
          description: List of notifications

  /user/notifications/read-all:
    post:
      tags: [User Notifications]
      summary: Mark all notifications as read
      responses:
        200:
          description: All notifications marked as read

  /user/dashboard:
    get:
      tags: [User Dashboard]
      summary: Full user dashboard
      description: >-
        Single aggregate endpoint for the user dashboard. Returns assignment and result
        counters together with the assessments the user can start now, what is coming
        up, anything left in progress, the latest results and the full evaluated
        history for a progress chart.
      parameters:
        - name: limit
          in: query
          required: false
          description: Size of each embedded list (default 5, max 50). Does not apply to performance.
          schema:
            type: integer
            default: 5
            maximum: 50

      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: object
                    properties:
                      assigned:
                        type: integer
                        description: Assignments deduped per assessment + batch
                      available:
                        type: integer
                        description: Startable right now and not yet attempted
                      upcoming:
                        type: integer
                      in_progress:
                        type: integer
                        description: Started but not submitted
                      completed:
                        type: integer
                      missed:
                        type: integer
                        description: Window closed with no attempt

                  results:
                    type: object
                    properties:
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                      evaluated:
                        type: integer
                      average_percentage:
                        type: number
                        description: Mean percentage over evaluated attempts, 0 when none
                      best_percentage:
                        type: number
                      lowest_percentage:
                        type: number

                  available_now:
                    type: array
                    description: Assessments the user can start right now
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  upcoming:
                    type: array
                    description: Scheduled but not yet open
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  in_progress:
                    type: array
                    description: Started but not submitted
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  recent_results:
                    type: array
                    description: Latest submitted attempts, newest first
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
                        status:
                          type: string
                          enum: [pending_evaluation, evaluated]
                        score:
                          type: number
                          nullable: true
                          description: Null while the attempt is pending evaluation
                        total_marks:
                          type: integer
                          nullable: true
                        percentage:
                          type: number
                          nullable: true

                  performance:
                    type: array
                    description: Every evaluated attempt, oldest first, for a progress chart
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
                        score:
                          type: number
                        total_marks:
                          type: integer
                        percentage:
                          type: number
        '401':
          description: Unauthenticated

  /user/reports/summary:
    get:
      tags: [User Reports]
      summary: Headline report for the logged-in user
      description: >-
        Totals, participation and score performance across the user's own attempts.
        Every filter is optional and combines.
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportStatus'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  totals:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      assessments:
                        type: integer
                  attempts:
                    type: object
                    properties:
                      total:
                        type: integer
                      in_progress:
                        type: integer
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                  participation:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      attempted:
                        type: integer
                      not_attempted:
                        type: integer
                      participation_rate:
                        type: number
                  performance:
                    $ref: '#/components/schemas/ReportPerformance'
                  score_distribution:
                    $ref: '#/components/schemas/ReportScoreDistribution'
        '401':
          description: Unauthenticated
        '422':
          description: Invalid filter values

