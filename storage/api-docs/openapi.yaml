  # -------------------------------------------------------- User --------------------------------------------------------
  /user/register:
    post:
      tags: [User Auth]
      summary: Register a new user account
      description: >-
        Creates a user account with `email_verified_at` unset. The account
        cannot log in until the email is verified via
        `/user/send-verification-code` + `/user/verify-email`. Public endpoint,
        no authentication required.
      operationId: userRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  description: Required. Max 255 characters.
                email:
                  type: string
                  format: email
                  description: Required. Must be a valid email and unique across all users.
                password:
                  type: string
                  format: password
                  description: Required. Minimum 8 characters. Stored hashed.

      responses:
        '201':
          description: User created successfully. Not yet able to log in until email verification completes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '422':
          description: Validation failed (missing field, invalid email, or email already registered).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/send-verification-code:
    post:
      tags: [User Auth]
      summary: Send an email verification OTP
      description: >-
        Emails a 6-digit numeric one-time code, valid for 10 minutes, to
        complete registration. Returns `429` if a still-valid code was already
        sent and hasn't expired yet — wait for it to expire before requesting
        another. Returns `422` if the account is already verified. Public
        endpoint, no authentication required.
      operationId: userSendVerificationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Required. Must belong to an existing user account.
      responses:
        '200':
          description: Verification code sent.
        '422':
          description: Validation failed (email not registered), or the email is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: A still-valid verification code was already sent — wait for it to expire before requesting another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/verify-email:
    post:
      tags: [User Auth]
      summary: Verify email using the OTP code
      description: >-
        Confirms the code sent by `/user/send-verification-code` and marks the
        account verified, allowing login. The code is single-use — it's deleted
        on successful verification, and re-use returns `422`. Public endpoint,
        no authentication required.
      operationId: userVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  description: Required. Must belong to an existing user account.
                code:
                  type: string
                  description: Required. The 6-digit code emailed to this address.
      responses:
        '200':
          description: Email verified successfully.
        '422':
          description: Validation failed (email not registered), the email is already verified, or the code is invalid/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/login:
    post:
      tags: [User Auth]
      summary: Log in as a user
      description: >-
        Verifies email/password and issues a Passport token, which is returned
        in the response body and also set as the httpOnly `user_access_token`
        cookie (30 day expiry). Fails with `403` if the account's email has not
        yet been verified. Public endpoint, no authentication required.
      operationId: userLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  description: Minimum 8 characters (validation only — any length is checked against the stored hash).

      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthResponse'
        '401':
          description: Email not found, or password does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email not yet verified — complete the send-code/verify-email flow first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed (missing or malformed field).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/me:
    get:
      tags: [User Auth]
      summary: Get the authenticated user's profile
      description: Returns the user record for the token/cookie used on the request. Requires user authentication.
      operationId: userMe
      responses:
        '200':
          description: User profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated — missing, invalid or expired user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/logout:
    post:
      tags: [User Auth]
      summary: Log out the authenticated user
      description: >-
        Revokes the Passport token used on the request and clears the
        `user_access_token` cookie. Requires user authentication.
      operationId: userLogout
      responses:
        '200':
          description: Logged out successfully.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Assessments
  /user/assessments/upcoming:
    get:
      tags: [User Assessments]
      summary: List upcoming assessments
      description: >-
        Active, non-flexible assessments assigned to the user whose batch is
        scheduled for a future date, or for today but not yet open. Flexible
        assessments never appear here (they have no fixed start time). Requires user authentication.
      operationId: userListUpcomingAssessments
      responses:
        '200':
          description: List of upcoming assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/today:
    get:
      tags: [User Assessments]
      summary: List today's assessments
      description: >-
        Active, non-flexible assessments assigned to the user whose batch is
        scheduled for today but hasn't opened yet (start time still in the
        future). Requires user authentication.
      operationId: userListTodayAssessments
      responses:
        '200':
          description: List of today's assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/running:
    get:
      tags: [User Assessments]
      summary: List currently attemptable assessments
      description: >-
        Active assessments the user can start (or resume) right now: for
        non-flexible ones, today is within the batch's publish date/time window;
        for flexible ones, the batch hasn't expired. Excludes any the user has
        already submitted. Requires user authentication.
      operationId: userListRunningAssessments
      responses:
        '200':
          description: List of running assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/completed:
    get:
      tags: [User Assessments]
      summary: List completed assessments
      description: Assessments the user has an attempt recorded against (started and/or submitted), regardless of the assessment's active/schedule state. Requires user authentication.
      operationId: userListCompletedAssessments
      responses:
        '200':
          description: List of completed assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/missed:
    get:
      tags: [User Assessments]
      summary: List missed assessments
      description: >-
        Active, non-flexible assessments assigned to the user whose window has
        closed (past publish date, or today with end time passed) without an
        attempt being recorded. Flexible assessments never appear here (they
        have no fixed closing time to miss). Requires user authentication.
      operationId: userListMissedAssessments
      responses:
        '200':
          description: List of missed assessments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{id}:
    get:
      tags: [User Assessments]
      summary: Get an assigned assessment
      description: >-
        Retrieve a single assessment only if it is (or was) assigned to the
        authenticated user — uses the user's most recent assignment for this
        assessment, together with its batch schedule. Requires user authentication.
      operationId: userGetAssessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Assessment ID.
      responses:
        '200':
          description: Assigned assessment details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAssessmentListItem'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{assessment_id}/start:
    post:
      tags: [User Assessment Attempts]
      summary: Start (or resume) an assessment attempt
      description: >-
        Creates the attempt row for the user's most recent assignment to this
        assessment, recording `started_at`. Idempotent while in progress —
        calling it again on an already-started, not-yet-submitted attempt
        returns `200` with the existing attempt instead of creating a second
        one; calling it after submission returns `403`. Availability is checked
        strictly against the assigned batch's schedule (fixed window for
        non-flexible assessments, or unexpired for flexible ones) regardless of
        the assessment's own `is_active` flag. Requires user authentication.
      operationId: userStartAttempt
      parameters:
        - in: path
          name: assessment_id
          required: true
          description: Assessment ID.
          schema:
            type: integer
      responses:
        '201':
          description: New attempt started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assessment started
                  attempt:
                    $ref: '#/components/schemas/AssessmentAttempt'
        '200':
          description: An in-progress attempt already exists — resume it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Resume your current attempt
                  attempt:
                    $ref: '#/components/schemas/AssessmentAttempt'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The assessment is outside its available window, or has already been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to the user, or does not exist / is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'The assigned batch no longer exists (data integrity edge case — "Batch not found").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{assessment_id}/submit:
    post:
      tags: [User Assessment Attempts]
      summary: Submit the current attempt and grade it
      description: >-
        Finalizes the in-progress attempt for the user's most recent assignment
        to this assessment. `mcq` assessments are graded immediately (with
        negative marking applied if `has_negative` is set, floored at 0);
        `descriptive` is marked `"Pending Evaluation"` for an admin to grade
        later. No request body. Requires user authentication.
      operationId: userSubmitAttempt
      parameters:
        - in: path
          name: assessment_id
          required: true
          description: Assessment ID.
          schema:
            type: integer
      responses:
        '200':
          description: Assessment submitted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Assessment submitted successfully
                  score:
                    type: string
                    description: '`"<value>/<total>"` for mcq, or the literal `"Pending Evaluation"` for manually-graded types.'
                  correct:
                    type: integer
                    description: Always `0` for manually-graded types (not yet known).
                  total:
                    type: integer
                    description: Total number of questions in the assessment.
        '400':
          description: Assessment already submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to the user, or no attempt exists to submit (start it first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The assessment's type has no known grading path (data integrity edge case).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{assessment_id}/result:
    post:
      tags: [User Assessment Results]
      summary: Get the current attempt's result, with paginated question review
      description: >-
        Returns the score and a page of question-by-question review
        (correct/chosen option IDs — meaningful for `mcq`) for a submitted
        attempt. Returns `403` while the attempt is still `"Pending
        Evaluation"`. Note this is a `POST` (not `GET`) despite being read-only.
        Requires user authentication.
      operationId: userGetAttemptResult
      parameters:
        - in: path
          name: assessment_id
          required: true
          description: Assessment ID.
          schema:
            type: integer
        - in: query
          name: page
          required: false
          description: 1-based page number. Not validated — non-numeric or out-of-range values behave like page 1 / an empty page.
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          required: false
          description: Questions per page. Not validated.
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Assessment result with score and paginated question breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: integer
                  total_marks:
                    type: integer
                    description: Total number of questions in the assessment.
                  percentage:
                    type: integer
                  correct:
                    type: integer
                  wrong:
                    type: integer
                  unanswered:
                    type: integer
                  questions:
                    type: array
                    description: The current page of questions, in this attempt's presented order.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        question_text:
                          type: string
                        options:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              option:
                                type: string
                        correct_option_id:
                          type: integer
                          nullable: true
                          description: The correct choice's ID, for mcq questions. Null when the question has no choice marked correct.
                        user_option_id:
                          type: integer
                          nullable: true
                          description: The choice ID the user selected. Null if unanswered.
                  current_page:
                    type: integer
                  total_pages:
                    type: integer
        '400':
          description: Assessment not submitted yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The attempt is still under manual evaluation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to the user, or no attempt exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{assessment_id}/questions:
    get:
      tags: [User Assessment Questions]
      summary: Get the current attempt's questions, in presented order
      description: >-
        Returns this assessment's questions in the order to present them to the
        user — generated (and persisted on the attempt as `question_order`) the
        first time this is called, shuffled if the assessment has `shuffle =
        true`, otherwise by authored `order`. Choices are included but with
        `is_correct` stripped out. Requires the attempt to already exist (call
        the start endpoint first) and to currently be within its running
        window. Requires user authentication.
      operationId: userGetAttemptQuestions
      parameters:
        - in: path
          name: assessment_id
          required: true
          description: Assessment ID.
          schema:
            type: integer
      responses:
        '200':
          description: List of questions with choices, in presented order.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/AssessmentQuestion'
                    - type: object
                      properties:
                        choices:
                          type: array
                          items:
                            $ref: '#/components/schemas/AssessmentChoicePublic'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The assessment is not currently within its running window (schedule closed, or flexible duration elapsed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to the user, or no attempt exists (start it first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'The assigned batch no longer exists (data integrity edge case — "Batch not found").'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/assessments/{assessment_id}/answer:
    post:
      tags: [User Assessment Answers]
      summary: Save or update the answer to one question
      description: >-
        Upserts the answer for `question_id` on the user's current attempt (at
        most one answer per question — calling again for the same question
        overwrites it). The required fields depend on the assessment's type:
        for `mcq`, `choice_id` is required and must be a choice belonging to
        `question_id`; for `descriptive`, `answer` is required instead (free
        text) and `choice_id` is ignored. Rejected with `403` once the attempt is
        submitted, or once the assessment's time window has closed (batch end
        time passed, or flexible duration elapsed). Requires user authentication.
      operationId: userSaveAnswer
      parameters:
        - in: path
          name: assessment_id
          required: true
          description: Assessment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id]
              properties:
                question_id:
                  type: integer
                  description: Required. Must belong to this assessment.
                choice_id:
                  type: integer
                  nullable: true
                  description: Required for `mcq` questions (must belong to `question_id`); ignored for other types.
                answer:
                  type: string
                  nullable: true
                  description: Required (and non-empty) for `descriptive` questions; ignored for `mcq`.
      responses:
        '200':
          description: Answer saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Answer saved
                  answer:
                    $ref: '#/components/schemas/AssessmentAnswer'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The assessment has already been submitted, or its time window has closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Assessment not assigned to the user, no attempt exists, `question_id` does not belong to this assessment, or `choice_id` does not belong to `question_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validation failed (missing required `choice_id`/`answer` for the assessment''s type), or the assessment''s type has no known answer-handling path.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/notifications:
    get:
      tags: [User Notifications]
      summary: List unread notifications
      description: Returns the authenticated user's unread notifications, newest first. Requires user authentication.
      operationId: userListNotifications
      responses:
        '200':
          description: List of notifications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/notifications/read-all:
    post:
      tags: [User Notifications]
      summary: Mark all notifications as read
      description: Marks every notification belonging to the authenticated user as read (not scoped to currently-unread ones — safe to call repeatedly). Requires user authentication.
      operationId: userMarkAllNotificationsRead
      responses:
        '200':
          description: All notifications marked as read.
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/dashboard:
    get:
      tags: [User Dashboard]
      summary: Full user dashboard
      description: >-
        Single aggregate endpoint for the user dashboard. Returns assignment and
        result counters together with the assessments the user can start now,
        what is coming up, anything left in progress, the latest results and
        the full evaluated history for a progress chart. Requires user authentication.
      operationId: userDashboard
      parameters:
        - name: limit
          in: query
          required: false
          description: Size of each embedded list (default 5, max 50). Does not apply to `performance`, which always returns every evaluated attempt.
          schema:
            type: integer
            default: 5
            maximum: 50

      responses:
        '200':
          description: Dashboard payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: object
                    properties:
                      assigned:
                        type: integer
                        description: Assignments deduped per assessment + batch.
                      available:
                        type: integer
                        description: Startable right now and not yet attempted.
                      upcoming:
                        type: integer
                      in_progress:
                        type: integer
                        description: Started but not submitted.
                      completed:
                        type: integer
                      missed:
                        type: integer
                        description: Window closed with no attempt.

                  results:
                    type: object
                    properties:
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                      evaluated:
                        type: integer
                      average_percentage:
                        type: number
                        description: Mean percentage over evaluated attempts, 0 when none.
                      best_percentage:
                        type: number
                      lowest_percentage:
                        type: number

                  available_now:
                    type: array
                    description: Assessments the user can start right now.
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  upcoming:
                    type: array
                    description: Scheduled but not yet open.
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  in_progress:
                    type: array
                    description: Started but not submitted.
                    items:
                      $ref: '#/components/schemas/UserDashboardAssessment'

                  recent_results:
                    type: array
                    description: Latest submitted attempts, newest first.
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
                        status:
                          type: string
                          enum: [pending_evaluation, evaluated]
                        score:
                          type: number
                          nullable: true
                          description: Null while the attempt is pending evaluation.
                        total_marks:
                          type: integer
                          nullable: true
                        percentage:
                          type: number
                          nullable: true

                  performance:
                    type: array
                    description: Every evaluated attempt, oldest first, for a progress chart.
                    items:
                      type: object
                      properties:
                        attempt_id:
                          type: integer
                        assessment_id:
                          type: integer
                        assessment_title:
                          type: string
                          nullable: true
                        batch_id:
                          type: integer
                          nullable: true
                        submitted_at:
                          type: string
                          example: '18:36:09'
                        score:
                          type: number
                        total_marks:
                          type: integer
                        percentage:
                          type: number
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/reports/summary:
    get:
      tags: [User Reports]
      summary: Headline report for the logged-in user
      description: >-
        Totals, participation and score performance across the user's own
        attempts. Every filter is optional and combines. Requires user authentication.
      operationId: userReportSummary
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportStatus'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: Summary report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  totals:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      assessments:
                        type: integer
                        description: Distinct assessments the user is assigned to, matching the filters.
                  attempts:
                    type: object
                    properties:
                      total:
                        type: integer
                      in_progress:
                        type: integer
                      submitted:
                        type: integer
                      pending_evaluation:
                        type: integer
                  participation:
                    type: object
                    properties:
                      assigned:
                        type: integer
                      attempted:
                        type: integer
                      not_attempted:
                        type: integer
                      participation_rate:
                        type: number
                  performance:
                    $ref: '#/components/schemas/ReportPerformance'
                  score_distribution:
                    $ref: '#/components/schemas/ReportScoreDistribution'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/reports/assessments:
    get:
      tags: [User Reports]
      summary: One row per assessment the user has attempted, best average first
      description: Requires user authentication. Every filter is optional and combines.
      operationId: userReportAssessments
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportStatus'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPage'
        - $ref: '#/components/parameters/ReportPageSize'
      responses:
        '200':
          description: Per-assessment report, best average first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportAssessmentRow'
                  current_page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/reports/attempts:
    get:
      tags: [User Reports]
      summary: The user's own attempt history, newest first
      description: Requires user authentication. Every filter is optional and combines.
      operationId: userReportAttempts
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportStatus'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPage'
        - $ref: '#/components/parameters/ReportPageSize'
      responses:
        '200':
          description: Attempt history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportAttemptRow'
                  current_page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/reports/questions:
    get:
      tags: [User Reports]
      summary: Question-level breakdown of the user's own answers
      description: >-
        One row per answer the user has given, with correctness where it has
        been graded. Only submitted attempts are included, so this never
        reveals whether an answer is correct while an attempt is still in
        progress. Requires user authentication. Note: this report does not
        accept a `status`/`passing_percentage` filter (unlike the other user
        reports), since it operates on individual answers, not whole attempts.
      operationId: userReportQuestions
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPage'
        - $ref: '#/components/parameters/ReportPageSize'
      responses:
        '200':
          description: Per-answer report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  totals:
                    type: object
                    properties:
                      answers:
                        type: integer
                      graded:
                        type: integer
                      correct:
                        type: integer
                      wrong:
                        type: integer
                      accuracy:
                        type: number
                        description: '`correct / graded` as a percentage. `0` when nothing is graded.'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportQuestionRow'
                  current_page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/reports/progress:
    get:
      tags: [User Reports]
      summary: Evaluated attempts over time with a running average
      description: >-
        Chronological list of the user's evaluated attempts, each carrying the
        cumulative average up to that point, plus an overall `trend` (last
        percentage minus first). Requires user authentication.
      operationId: userReportProgress
      parameters:
        - $ref: '#/components/parameters/ReportAssessmentId'
        - $ref: '#/components/parameters/ReportBatchId'
        - $ref: '#/components/parameters/ReportPassingPercentage'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportPage'
        - $ref: '#/components/parameters/ReportPageSize'
      responses:
        '200':
          description: Progress report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/ReportFilters'
                  passing_percentage:
                    type: number
                  trend:
                    type: number
                    description: Last percentage minus first, `0` with fewer than two evaluated attempts.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserReportProgressRow'
                  current_page:
                    type: integer
                  page_size:
                    type: integer
                  total:
                    type: integer
                  total_pages:
                    type: integer
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Invalid filter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
